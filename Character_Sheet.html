<html lang="en">

<style>
/* ============================================================
   CHARACTER SHEET — CHICAGO 2089 — DUALITY EDITION
   Built by gen_sheet.py from the Mechanics Compendium. Do not edit the
   rules text here: edit the compendium and rebuild.
   Large print by default. A− / A+ scale everything; Contrast cycles
   Paper, High contrast dark, High contrast light.
   ============================================================ */
:root{
  --bg:#f7f2ea; --panel:#ffffff; --ink:#14110f; --ink-soft:#3a342f; --rule:#b9ad9c;
  --accent:#8a2721; --accent-ink:#ffffff; --mark:#8a2721; --mark-ink:#ffffff; --focus:#1f5fbf;
  --good:#2f5d1e; --warn:#8a2721; --chip:#efe6d6;
  --sans:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  --serif:"Charter","Iowan Old Style",Georgia,serif;
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#111111; --ink:#ffffff; --ink-soft:#e6e6e6; --rule:#8c8c8c;
  --accent:#ffd400; --accent-ink:#000000; --mark:#ffd400; --mark-ink:#000000; --focus:#00e5ff;
  --good:#7dff8a; --warn:#ffd400; --chip:#262626;
}
:root[data-theme="light"]{
  --bg:#ffffff; --panel:#ffffff; --ink:#000000; --ink-soft:#1a1a1a; --rule:#000000;
  --accent:#0033a0; --accent-ink:#ffffff; --mark:#0033a0; --mark-ink:#ffffff; --focus:#c40000;
  --good:#005a00; --warn:#b00000; --chip:#e8eefc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#000000; --panel:#111111; --ink:#ffffff; --ink-soft:#e6e6e6; --rule:#8c8c8c;
    --accent:#ffd400; --accent-ink:#000000; --mark:#ffd400; --mark-ink:#000000; --focus:#00e5ff;
    --good:#7dff8a; --warn:#ffd400; --chip:#262626;
  }
}
*{box-sizing:border-box}
html{font-size:20px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;overflow-wrap:anywhere}
#app,#bar,#dlg,.wrap,section,.card,.panel,.tracker,.stat{min-width:0;max-width:100%}
dialog .dh h2{min-width:0}
a{color:var(--accent)}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{max-width:52rem;margin:0 auto;padding:0 16px 5rem}

/* Top bar */
#bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--ink)}
#bar .in{max-width:52rem;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* The bar keeps a fixed size so large text doesn't let it cover the screen; pinch-zoom still enlarges it. */
#bar{font-size:18px}
#bar button{font-size:18px;min-height:48px;padding:6px 12px}
#bar .who{flex:1 1 8em;font-weight:800;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .saved{font-size:15px;color:var(--ink-soft)}
@media (max-width:520px){ #bar .who{display:none} #bar .in{justify-content:flex-end} }
section,h2{scroll-margin-top:90px}
button,.btn{font:inherit;font-size:.95rem;font-weight:700;min-height:48px;min-width:48px;padding:.4rem .8rem;border:3px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.3em;max-width:100%;white-space:normal;text-align:center;overflow-wrap:break-word}
dialog .dh button{white-space:nowrap;flex:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{min-height:44px;font-size:.85rem;padding:.2rem .6rem}
button.danger{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.45;cursor:default}

nav.jump{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0}
nav.jump a{display:inline-block;padding:.35rem .7rem;border:2px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.85rem;background:var(--chip)}

section{margin:1.4rem 0;padding-top:.2rem}
h1{font-family:var(--serif);font-size:1.8rem;line-height:1.15;margin:1rem 0 .2rem}
h2{font-family:var(--serif);font-size:1.45rem;margin:0 0 .6rem;padding-bottom:.2rem;border-bottom:3px solid var(--ink);scroll-margin-top:6rem}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
.lede{color:var(--ink-soft);margin:0 0 1rem}
.panel{background:var(--panel);border:2px solid var(--rule);border-radius:12px;padding:.8rem 1rem;margin:.7rem 0}
.panel.feature{border-left:8px solid var(--accent)}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}

label.f{display:block;font-weight:800;margin:.8rem 0 .25rem}
input[type=text],input[type=number],select,textarea{max-width:100%;font:inherit;font-size:1rem;width:100%;min-height:52px;padding:.45rem .6rem;border:3px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink)}
textarea{min-height:6rem;resize:vertical}
select{appearance:auto}
.row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-start}
.row>*{flex:1 1 min(12rem,100%);min-width:0}
.check{display:flex;gap:.6rem;align-items:center;min-height:48px;font-weight:700;cursor:pointer}
.check input{width:32px;height:32px;flex:none;accent-color:var(--accent)}
.radio-row{display:flex;flex-wrap:wrap;gap:.6rem}
.radio-row label{flex:1 1 min(10rem,100%);min-width:0;border:3px solid var(--ink);border-radius:10px;padding:.5rem .7rem;display:flex;gap:.5rem;align-items:center;font-weight:800;cursor:pointer;min-height:52px}
.radio-row input{width:28px;height:28px;accent-color:var(--accent)}

/* Big numbers */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9rem,100%),1fr));gap:.7rem}
.stat{background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:.5rem .7rem;text-align:center}
.stat .k{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.stat .v{font-size:2.2rem;font-weight:900;line-height:1.1}
.stat .d{font-size:.78rem;color:var(--ink-soft)}

/* Trackers */
.tracker{background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:.6rem .8rem;margin:.7rem 0}
.tracker .top{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;justify-content:space-between}
.tracker .name{font-size:1.2rem;font-weight:900}
.tracker .count{font-size:1.05rem;font-weight:800}
.boxes{display:flex;flex-wrap:wrap;gap:8px;margin:.5rem 0}
.box{width:2.9rem;height:2.9rem;min-width:0;padding:0;border:3px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);font-size:1.1rem;font-weight:900}
.box[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.box.lost{background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 6px,var(--rule) 6px,var(--rule) 9px);color:var(--ink-soft)}
.pm{display:flex;gap:8px}
.pm button{font-size:1.4rem;min-width:2.6rem;padding:.1rem .4rem}

/* Traits */
.trait{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem .8rem;align-items:center;background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:.5rem .8rem;margin:.5rem 0}
.trait .nm{font-size:1.2rem;font-weight:900;min-width:0}
.trait .val{display:flex;align-items:center;gap:8px;max-width:100%}
.trait .val button{padding:.2rem .5rem}
.trait .num{font-size:min(2rem,14vw);font-weight:900;min-width:2.2em;text-align:center}
.trait .what{flex-basis:100%;font-size:.85rem;color:var(--ink-soft)}

/* Cards, features */
.card{background:var(--panel);border:3px solid var(--ink);border-radius:12px;padding:.6rem .8rem;margin:.6rem 0}
.card .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem .8rem;align-items:baseline}
.card .nm{font-size:1.15rem;font-weight:900}
.card .meta{font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.card .tx{margin:.4rem 0}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:.4rem}
.card.inactive{border-style:dashed}
.tag{display:inline-block;background:var(--chip);border:2px solid var(--rule);border-radius:999px;padding:0 .6rem;font-size:.8rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:.4rem 0}
.chips button{font-size:.85rem;min-height:44px;background:var(--chip)}
.warn{color:var(--warn);font-weight:800}
.good{color:var(--good);font-weight:800}

/* Dialogs */
dialog{border:4px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);padding:0;width:min(46rem,calc(100vw - 16px));max-height:calc(100vh - 16px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dh{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;justify-content:space-between;padding:.6rem .8rem;border-bottom:3px solid var(--ink);z-index:2}
dialog .dh h2{border:0;margin:0;padding:0;font-size:1.25rem}
dialog .db{padding:.4rem .8rem 1rem}
.result{font-size:3.2rem;font-weight:900;line-height:1.1;text-align:center;margin:.4rem 0}
.outcome{font-size:1.5rem;font-weight:900;text-align:center}
.dice{display:flex;justify-content:center;flex-wrap:wrap;gap:.8rem;margin:.6rem 0}
.die{border:3px solid var(--ink);border-radius:12px;padding:.3rem .8rem;text-align:center;min-width:min(6rem,100%);background:var(--panel)}
.die b{display:block;font-size:2rem}
.banner{background:var(--warn);color:var(--bg);font-weight:800;padding:.6rem .9rem;border-radius:10px;margin:.8rem 0}
@media print{#bar,nav.jump,.acts,button{display:none!important}}
</style>
</head>

<script>

'use strict';
var D = {"traits": {"Agility": "Sprint, leap, dodge. Running the SkyPark canopy, slipping through a crowd, shooting on the move.", "Strength": "Lift, smash, grapple. Breaking a door down, holding one shut, heavy weapons, gorilla arms.", "Finesse": "Control, hide, tinker. Pistols and blades, picking locks, building and fixing things by hand.", "Instinct": "Notice, sense, navigate. Reading a room for danger, spotting the camera, waiting for the shot, driving.", "Presence": "Charm, perform, deceive. Talking your way in, working a crowd, giving orders people follow.", "Knowledge": "Recall, analyze, figure out. Your deck and every quickhack, working out what's wrong, reading the paperwork, the deep net."}, "traditions": [{"id": "nomad", "name": "Nomad", "opener": "The road is infrastructure, and you keep it running. You've survived by knowing things the city forgot how to know.", "evasion": 10, "hp": 6, "domains": ["Ghost", "Forge"], "suggested": {"Finesse": 2, "Instinct": 1, "Knowledge": 1, "Agility": 0, "Strength": 0, "Presence": -1}, "kit": "A clan-built Van with one fitting (Section B): +2 to both its thresholds, and no corporate software in it, so nothing can hack, track, or brick it. A Road Radio; a Fab diagram for one Tier 1 item; and a clan that knows your name.", "experiences": ["Ran with the Aldecaldos", "Clan Botanist", "Border Coyote", "Garage-Raised", "Nobody Sees Me Leave", "Drove the Salt Flats at Night"], "classFeature": {"name": "Clan Road", "text": "The clans will help you: a safe route, a place to sleep, a message that leaves no trace, a name in a city you've never seen. Keep a <strong>Clan Standing<\/strong> score on your sheet from −3 to +3. It goes up when you do the clans a favor and down when you take more than you give; at −3 they stop answering until you make it right. <em>Once per long rest, an urgent request goes through in hours instead of days.<\/em>"}, "hopeFeature": {"name": "Road Law", "text": "Spend 3 Hope: one roll to drive, find your way, build, or survive succeeds with Hope, and every ally within Close range clears a Stress."}, "background": ["What did the clan lose that you came to Chicago to get back?", "What grows where you come from, and who owns the ground now?", "Which corp logo do you never let anyone wear in your vehicle?"], "connections": ["Which of us rode with you before the city, and what did you have to leave on that road?", "Which of us do you trust with the keys?"], "paths": [{"name": "Coyote", "tag": "Play the Coyote if you want to get people through.", "features": [{"name": "Under the Wire", "rank": "Foundation", "when": "Foundation · level 1", "text": "Sensors get no return from you: aug scanners, drone optics, and biometric gates read nothing. Mark a Stress to move anywhere within Far range along a route no sensor covers, bringing one ally with you. You're both Hidden from machines when you arrive."}, {"name": "Dead Zone", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Any jammer or dead zone you place (a Squelch Puck, a Dead Zone Emitter, a Signal Jammer; Sections B and D) leaves the crew's own gear working, and you can trigger one you've placed from Far range as part of any action. While one of yours is up, you and allies inside it are Hidden from machines."}, {"name": "Gone", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Mark a Stress to become Hidden at any time, even in the open, and stay Hidden until you roll with Fear or rest. Anyone within Very Close range of you when you do it goes with you."}]}, {"name": "Fabricator", "tag": "Play the Fabricator if you want the crew's gear to exist in no database anywhere.", "features": [{"name": "Fab Access", "rank": "Foundation", "when": "Foundation · level 1", "text": "Anything you build reads as unknown to every corporate scanner and can't be tracked, jammed, or hacked. A clan garage answers you within a day anywhere in the metropolis: somewhere to build, somewhere to hide a vehicle, somewhere nobody's camera reaches."}, {"name": "Field Line", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per scene, mark a Stress and build one thing from what's around you, in your hand right now: a Tier 1 clan catalog item (Section D), a cell that runs any dead device for the scene, or a patch that holds a broken machine together for the scene. Once per long rest, a Tier 2 catalog item the same way."}, {"name": "The Doctrine", "rank": "Mastery", "when": "Mastery · tier 3", "text": "The crew rides your line. Each ally can wear one clan kit item (Section D) in a kit slot of their own without spending an augment slot; two at tier 4. Once per session, hand an ally a clan-made copy of any Tier 1 augment as a kit item, built while they wait."}]}]}, {"id": "solo", "name": "Solo", "opener": "You are the most dangerous person in this room. You've learned to carry that fact quietly, because the ones who announce it are amateurs, and amateurs are expensive.", "evasion": 11, "hp": 7, "domains": ["Iron", "Command"], "suggested": {"Agility": 2, "Strength": 1, "Instinct": 1, "Finesse": 0, "Presence": 0, "Knowledge": -1}, "kit": "A Cycle; a second weapon of your choice from the Tier 1 rows; a Trauma Kit; a set of Encrypted Comms for the crew; and someone who hires muscle.", "experiences": ["Ex-Arasaka Bodyguard", "Enforcer for a Belt Crew", "Militech Washout", "Cage Fighter", "Never Fired First", "Knows Every Exit"], "classFeature": {"name": "Threat Clock", "text": "You see a fight coming before the first move. You're never surprised when things turn violent. <em>Spend a Hope when it kicks off: you act first, before any adversary, and nobody in your crew is caught flat-footed. The GM can't spend Fear to go before you.<\/em>"}, "hopeFeature": {"name": "The Professional", "text": "Spend 3 Hope: clear 2 Armor Slots, and your next attack this scene has advantage."}, "background": ["Who trained you, and what did they get wrong?", "What is the job you don't take, and who found that out the hard way?", "What does your body do in the second before it goes?"], "connections": ["Which of us were you once paid to hurt, and why didn't you?", "Which of us do you step in front of without thinking?"], "paths": [{"name": "Hitter", "tag": "Play the Hitter if you want to be the one who ends fights.", "features": [{"name": "Momentum", "rank": "Foundation", "when": "Foundation · level 1", "text": "On a roll with Hope, you can bank a d6 on this card instead of gaining a Hope, up to your Proficiency. When you make an attack roll or a damage roll, spend any number of them and add what they show. At the end of each session, clear any left and gain a Hope per die cleared."}, {"name": "Closer", "rank": "Specialization", "when": "Specialization · tier 2", "text": "When you hit, you can spend a Hope to add one of your secondary weapon's damage dice to the roll. When you drop an adversary, bank a d6 on Momentum without giving up a Hope, even past your limit."}, {"name": "Finish It", "rank": "Mastery", "when": "Mastery · tier 3", "text": "When you drop an adversary, keep the spotlight and act again. Once per scene, spend every banked die at once: the attack they're spent on also makes the target mark a Stress per die."}]}, {"name": "Bodyguard", "tag": "Play the Bodyguard if you want to be the reason nobody else gets hurt.", "features": [{"name": "Principal", "rank": "Foundation", "when": "Foundation · level 1", "text": "At the start of a scene, name your principal: an ally or a client. While you're within Very Close range of them you have +1 Armor Score, and when they're attacked you can mark a Stress to take the attack instead."}, {"name": "Answer", "rank": "Specialization", "when": "Specialization · tier 2", "text": "When your principal is attacked, mark a Stress: you attack the attacker immediately, before the spotlight moves, whether or not the attack on them landed."}, {"name": "Not Today", "rank": "Mastery", "when": "Mastery · tier 3", "text": "While you're within Very Close range of your principal, any attack on them comes to you instead if you choose, and it costs you nothing. Once per long rest, when your principal would mark their last Hit Point, they don't: mark 2 Stress and describe how you got there in time."}]}]}, {"id": "hacker", "name": "Hacker", "opener": "Every network has a shape. Most people see the surface — the login screens, the error messages, the access denied. You see the plumbing.", "evasion": 11, "hp": 5, "domains": ["Wire", "Archive"], "suggested": {"Knowledge": 2, "Finesse": 1, "Instinct": 1, "Agility": 0, "Presence": 0, "Strength": -1}, "kit": "A Standard Deck with three Tier 1 loads (Section B); a Firewall and a Passive Scanner on your interface; a Grey Box; a jack behind your ear; and a data broker who calls you first.", "experiences": ["Kid Who Broke the SkyPark Grid", "Ex-Corporate Sysadmin", "Deck Built From Scrap", "Has Been Dead in the Net", "Reads Corps Like Code", "Never Leaves a Log"], "classFeature": {"name": "Persistent Access", "text": "Once you've broken into a network, you can always get back in. Whenever a network's Progress countdown completes with you on it, you take a <strong>Backdoor<\/strong> there in addition to your prize. Write it on your sheet. <em>Once per long rest, walk straight back through one of your Backdoors and start where you left off, with the Consequence countdown where it was when you left.<\/em>"}, "hopeFeature": {"name": "Clean Run", "text": "Spend 3 Hope: one deck roll succeeds with Hope, and the Consequence countdown doesn't tick this action."}, "background": ["What network did you get into that you shouldn't have, and what did you see there?", "Who owns the deck you run, and who still thinks they do?", "What did you see on your first death in the net?"], "connections": ["Which of us has a secret you found in a log and never mentioned?", "Which of us have you met in the net without them knowing it was you?"], "paths": [{"name": "Runner", "tag": "Play the Runner if you want to hack at gunfight pace.", "features": [{"name": "Quick Draw", "rank": "Foundation", "when": "Foundation · level 1", "text": "+1 to deck attacks in a fight. Once per scene, fire off a quickhack at someone within Close range as part of attacking or moving, instead of as its own action."}, {"name": "Hot Deck", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Your deck holds one more load than its rating. Once per scene, when a quickhack fails with Hope, nobody notices it happened."}, {"name": "Double Tap", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Mark a Stress to make two deck attacks in one action. Your quickhacks ignore Firewalls."}]}, {"name": "Deep Seer", "tag": "Play the Deep Seer if you want to go where the net stops being a place.", "features": [{"name": "Deep Hands", "rank": "Foundation", "when": "Foundation · level 1", "text": "In any network or zone, when you succeed with Hope on a deck roll, tick Progress one extra. Your frag Experiences are +3 instead of +2. <em>Once per long rest, thread the whole crew through a contested zone of your tier or lower without a fight.<\/em>"}, {"name": "Standing Feed", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Zones and networks one tier above yours count as your tier. You can see and hear through the cameras and mics of any network you hold a Backdoor to, from wherever you are, without jacking in or going under."}, {"name": "Switchboard", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Every network you hold a Backdoor to is linked: from inside any one of them, you can work in any other as if you were on site. You can use Persistent Access's walk-back twice per long rest instead of once."}]}]}, {"id": "face", "name": "Face", "opener": "People are a skill. Reading them, managing how they see you, knowing who to call and how to ask: all of it can be learned, and you learned it.", "evasion": 10, "hp": 5, "domains": ["Voice", "Ledger"], "suggested": {"Presence": 2, "Instinct": 1, "Knowledge": 1, "Agility": 0, "Finesse": 0, "Strength": -1}, "kit": "Clothes for both rooms (corporate and SkyPark); two sets of convincing credentials; a Burner ID; and a friend who talks to everyone.", "experiences": ["Working Girl of the Shade", "Consortium Party Circuit", "Everybody Owes Me Something", "Grew Up in a Union Hall", "Never the Same Face Twice", "Reads a Room Before the Door Shuts"], "classFeature": {"name": "Room", "text": "The moment you walk in, you know who actually runs the room, who's nervous, and who's about to leave. <em>Spend a Hope: the GM tells you what the room wants and who you need to get past to get it.<\/em>"}, "hopeFeature": {"name": "The Read", "text": "Spend 3 Hope: one Presence Roll against a person succeeds with Hope, and the GM tells you what that person is most afraid of right now."}, "background": ["What room did you walk into that you weren't supposed to walk out of, and how did you leave?", "Who taught you the voice, and what did they use it for?", "What is the price of your time, and who has been paying it lately?"], "connections": ["Which of us did you talk out of something stupid, and what did it cost you?", "Which of us knows the face you wear at home?"], "paths": [{"name": "Broker", "tag": "Play the Broker if you want everyone to owe you.", "features": [{"name": "Middleman", "rank": "Foundation", "when": "Foundation · level 1", "text": "When two parties make a deal through you, you gain a Hope and a fistful of dollars. Once per long rest, name what the crew needs and a price for it, and someone who can pay that price does &mdash; then the GM names one thing about them: they want something back, they're hard to reach, they're already in trouble, or you didn't part on good terms."}, {"name": "Markers", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Keep a <strong>Markers<\/strong> count on your sheet, up to your tier plus 2. Gain one when you do someone a favor that costs you something. Spend one for a favor worth about a stack of dollars: a ride, a room, a document, a body. No roll, no strings yet."}, {"name": "Everyone Owes You", "rank": "Mastery", "when": "Mastery · tier 3", "text": "At the start of each session, name one NPC in play who owes you a Marker. The GM tells you why, and it's true."}]}, {"name": "Chameleon", "tag": "Play the Chameleon if you want to be whoever the door needs.", "features": [{"name": "Second Face", "rank": "Foundation", "when": "Foundation · level 1", "text": "You have one fake identity with real paper and a real history. It passes any automated check without a roll, and you can mark a Stress to have it pass a human one."}, {"name": "Quick Change", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per scene, mark a Stress to become a different person in the time it takes to turn around. Presence Rolls to hold any cover are at +2."}, {"name": "Nobody", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Once per session, become someone else in the middle of a scene with no roll. Witnesses remember the cover, not you, and any recording agrees with them."}]}]}, {"id": "corp", "name": "Corp", "opener": "You know how a company really works, because you were inside one, or you studied them so closely it makes no difference.", "evasion": 10, "hp": 5, "domains": ["Ledger", "Command"], "suggested": {"Knowledge": 2, "Presence": 1, "Instinct": 1, "Finesse": 0, "Agility": 0, "Strength": -1}, "kit": "A corporate ID whose badge still scans; a Corporate Executive Suit; a Sedan; an expense account worth a stack a month while it lasts; and an old colleague who still takes your calls.", "experiences": ["Ex-Militech Procurement", "Consortium Middle Management", "Signed Things I Shouldn't Have", "Still Has a Badge", "Speaks Fluent Compliance", "Knows Where the Bodies Are Budgeted"], "classFeature": {"name": "Paper", "text": "You can tell at a glance what a contract, a permit, or a badge really lets someone do, and what it doesn't. <em>Spend a Hope: the GM tells you who signed it and what it would take to get them to sign yours.<\/em>"}, "hopeFeature": {"name": "Paper Trail", "text": "Spend 3 Hope: one roll that leans on a document, a badge, or an authorization succeeds with Hope, and the document you needed exists for the scene."}, "background": ["What did the company do that you signed off on?", "Who inside still thinks you're loyal, and what would change their mind?", "What is on the drive you kept?"], "connections": ["Which of us did your company hurt, and do they know it was your department?", "Which of us do you pay, and which of us do you owe?"], "paths": [{"name": "Exec", "tag": "Play the Exec if you want the company to do what you say.", "features": [{"name": "Signing Authority", "rank": "Foundation", "when": "Foundation · level 1", "text": "In any corporate space, you have advantage on Presence Rolls to give orders to anyone who looks junior to you. Once per scene, a staffer does one small thing you tell them to, no roll."}, {"name": "Budget", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per long rest, sign for company resources worth up to a case of dollars (a car, a room, a security team, a clinic bed) for one scene. A countdown (4) runs before someone checks the books."}, {"name": "C-Suite", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Once per scene, an order you give inside a company of your tier or lower is obeyed by whoever hears it, no roll, until someone senior countermands it. Once per session, a document you made up with Paper Trail becomes real: the records agree with it."}]}, {"name": "Bagman", "tag": "Play the Bagman if you believe everyone has a price and you know how to pay it.", "features": [{"name": "Grease", "rank": "Foundation", "when": "Foundation · level 1", "text": "You know who can be bought before you ask; the GM tells you when someone can't. When you bribe someone, the Presence Roll has +2. If it fails, you can mark a Stress to make it a failure with Hope: they say no, but nobody's offended and the GM gains no Fear."}, {"name": "Clean Money", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per session, spend a stack of dollars to make a problem go away: the crew's Heat drops by 1, or a person who saw something decides they didn't."}, {"name": "Everyone Has a Price", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Once per session, name a price and an adversary of your tier or lower who isn't a Solo or a Militech operator. They take the money and stand down for the scene."}]}]}, {"id": "media", "name": "Media", "opener": "The story is what happens after the fact is over. Getting the fact is the easy part.", "evasion": 10, "hp": 5, "domains": ["Archive", "Voice"], "suggested": {"Instinct": 2, "Presence": 1, "Knowledge": 1, "Agility": 0, "Finesse": 0, "Strength": -1}, "kit": "A show, a feed, or a byline with an audience; a recorder nobody can wipe remotely; two micro-cameras; a set of Encrypted Comms for the crew; and a source inside something that matters.", "experiences": ["Shade District Stringer", "NBN Washout", "Got the Footage First", "Sources Among the Groundskeepers", "Camera Always Running", "Knows What the Screens Don't Say"], "classFeature": {"name": "Platform", "text": "You have an audience. Anything you publish gets seen by people who matter, and people who matter know you can publish. <em>Spend a Hope: someone who doesn't want to be on camera does what you ask to stay off it.<\/em>"}, "hopeFeature": {"name": "Live", "text": "Spend 3 Hope: one roll made on camera succeeds with Hope, and every adversary in the scene who cares about being seen marks a Stress."}, "background": ["What story did you kill, and who paid for it?", "What story got someone killed, and was it worth it?", "What do you know about the SkyParks that you haven't run?"], "connections": ["Which of us is in your footage from before, and do they know?", "Which of us protects your sources when you can't?"], "paths": [{"name": "Investigator", "tag": "Play the Investigator if you want to know first.", "features": [{"name": "Leads", "rank": "Foundation", "when": "Foundation · level 1", "text": "Keep a <strong>Leads<\/strong> count on your sheet, up to your Instinct plus 2. Gain one whenever you find a clue. Spend one to ask the GM a yes-or-no question about a person, a place, or an outfit you already have a clue about, and get a true answer."}, {"name": "Corroborate", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per scene, when an ally states a detail about a scene you're both in, mark a Stress: it's true, unless something already established says otherwise."}, {"name": "Follow the Money", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Once per long rest, name a person. The GM tells you who pays them and what they're afraid of losing, and they're 2 Difficulty easier for you for the rest of the session."}]}, {"name": "Icon", "tag": "Play the Icon if you want a city full of people who will show up for you.", "features": [{"name": "Following", "rank": "Foundation", "when": "Foundation · level 1", "text": "People show up for you. Each of these once per long rest, and you say how the word goes out.<br>&bull; <strong>Turn Out:<\/strong> a crowd fills a public space within Far range for the scene &mdash; cover, confusion, and nobody moves through it fast.<br>&bull; <strong>Drown It Out:<\/strong> for the rest of the scene, nothing said in the open here is clearly heard, recorded, or reported straight.<br>&bull; <strong>Point Them:<\/strong> name someone in public. Every face turns, and they mark 2 Stress."}, {"name": "Crowd Work", "rank": "Specialization", "when": "Specialization · tier 2", "text": "When you use a Following move, each ally within Far range gains a Hope or clears a Stress, their choice."}, {"name": "Movement", "rank": "Mastery", "when": "Mastery · tier 3", "text": "You can use each Following move twice per long rest. Once per session, call it: your people fill a place you name, in numbers, and they stay until it costs them too much."}]}]}, {"id": "techie", "name": "Techie", "opener": "The machine doesn't lie. It does exactly what its instruction set tells it to do. The art is in reading the instruction set, not the machine.", "evasion": 11, "hp": 5, "domains": ["Forge", "Wire"], "suggested": {"Knowledge": 2, "Finesse": 1, "Instinct": 1, "Strength": 0, "Presence": 0, "Agility": -1}, "kit": "A Cyberdoc Kit; a Control Board and a Multi-Tool; a Scout Drone; and a workshop that isn't in your name.", "experiences": ["Ripperdoc Under the Parks", "Drone Kid", "Built the Clan Garage", "Ex-Zetatech Line Tech", "Talks to Machines", "Fixed It With a Spoon"], "classFeature": {"name": "Direct Command", "text": "Mark a Stress: for the scene, one machine you have access to (yours, or one you've rewritten or hijacked) does exactly what you tell it instead of what it was programmed to do. It's still the same machine; it just has your judgment now. For a machine you don't have access to, see Root Access."}, "hopeFeature": {"name": "Root Access", "text": "Spend 3 Hope: one roll to command, fix, rewrite, or hack a machine succeeds with Hope, and any machine within Close range obeys one order right now, whether you have access or not."}, "background": ["What did you build that's still running, and for whom?", "Who did you put back together, and who did you take apart?", "What is the machine you won't work on?"], "connections": ["Which of us did you install something in, and does it still work?", "Which of us calls you first when it breaks?"], "paths": [{"name": "Rigger", "tag": "Play the Rigger if you want a machine that's yours.", "features": [{"name": "Companion", "rank": "Foundation", "when": "Foundation · level 1", "text": "The Scout Drone from your kit is more than a drone: it's your companion, or swap it for a Micro Drone, a Crawler, a Patrol Drone, or a vehicle fitted with a Jack Control Port, and take that chassis from the table below. It gets its own sheet: Difficulty 10 plus its chassis bonus, a d6 attack, two Experiences at +2, 3 Stress, and one training option per level. Commanding it is a Knowledge Roll; spend a Hope to add one of its Experiences. When it would take damage it marks Stress instead, and when its Stress is full it limps off until your next long rest."}, {"name": "Uplink", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Choose one more training option for your companion. While an adversary is within your companion's Melee range, you have +2 to Evasion against that adversary's attacks."}, {"name": "War Machine", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Choose two more training options for your companion. Once per long rest, when a hit would mark your companion's last Stress or your last Hit Point and you're within Close range of each other, one of you takes it for the other. It can carry one mounted weapon from Section B: when it attacks, use that weapon's range and damage instead of its own."}]}, {"name": "Ripper", "tag": "Play the Ripper if you want to build people.", "features": [{"name": "Wired", "rank": "Foundation", "when": "Foundation · level 1", "text": "One extra augment slot, already filled with a second Tier 1 augment (or a Tier 3 one, if your story explains it). Once per long rest, swap what's in that slot for any augment you have on hand, at any bench."}, {"name": "Off the Books", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Chrome you install carries no leash. Nobody can track it, brick it, or make it glitch from a desk, and the GM can't spend Fear against it. Once per long rest, do the same to a piece of chrome somebody else installed."}, {"name": "Overbuilt", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Chrome you installed for an ally can't be knocked Offline. Once per scene, when that ally uses it, mark a Stress: every number on it goes up by your tier for that use."}]}]}, {"id": "cleaner", "name": "Cleaner", "opener": "The city has blind spots and you live in them. A Solo is hired to be seen coming; you're hired so nobody knows anyone came at all.", "evasion": 12, "hp": 5, "domains": ["Iron", "Ghost"], "suggested": {"Agility": 2, "Finesse": 1, "Instinct": 1, "Strength": 0, "Knowledge": 0, "Presence": -1}, "kit": "A Cloak Sheet; a Facial Mask; two Smoke grenades; Lockpicks; a Burner ID Kit; and a handler who never says your name.", "experiences": ["Arasaka-Trained, Once", "Nobody Sees Me Leave", "Militech Deniable", "Knows Every Service Corridor", "Sleeps in the Shade", "Has a List"], "classFeature": {"name": "From Nowhere", "text": "When you hit a target while you're Hidden, or while an ally is within Melee range of it, add a d6 per tier to the damage."}, "hopeFeature": {"name": "Vanish", "text": "Spend 3 Hope: one roll to go unseen, get somewhere unseen, or strike from Hidden succeeds with Hope, and when it resolves you're Hidden again."}, "background": ["Who was the first name on your list, and who put it there?", "What do you do with the traces, and what did you keep once?", "What is the job you turned down, and who took it instead?"], "connections": ["Which of us has seen your face and doesn't know it?", "Which of us do you watch when you can't sleep?"], "paths": [{"name": "Stalker", "tag": "Play the Stalker if you want the first hit to be the last.", "features": [{"name": "First Strike", "rank": "Foundation", "when": "Foundation · level 1", "text": "The first time each scene you hit someone, double the damage. Name a target at the start of a job: rolls to find, follow, or reach them have advantage."}, {"name": "Death Strike", "rank": "Specialization", "when": "Specialization · tier 2", "text": "When you deal Severe damage, mark a Stress: they mark one more Hit Point. You have +2 Evasion against your named target."}, {"name": "True Strike", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Once per long rest, when an attack fails, spend a Hope: it hits. Your First Strike also triggers the first time you hit any target while Hidden."}]}, {"name": "Troubleshooter", "tag": "Play the Troubleshooter if you want to be the one they call when it has already gone wrong.", "features": [{"name": "Groundwork", "rank": "Foundation", "when": "Foundation · level 1", "text": "You never walk in cold. At the start of a job take <strong>Groundwork<\/strong> tokens equal to your tier plus 1. Spend one to say what you set up before you got here: a way out, a vehicle nobody can trace, a uniform that fits, a tool already in the room, or somewhere to put a body. Clear what's left at your next long rest."}, {"name": "Contingency", "rank": "Specialization", "when": "Specialization · tier 2", "text": "Once per scene, mark a Stress to spend a Groundwork token in the middle of the trouble instead of ahead of it: what you needed is already here, and you say how. The GM tells you the one thing it doesn't cover."}, {"name": "Everyone's Prepared", "rank": "Mastery", "when": "Mastery · tier 3", "text": "Your crew works off what you left them. Any ally within Far range can mark a Stress to spend one of your Groundwork tokens, and they say what it was. Your pool is your tier plus 2."}]}]}], "domains": {"Iron": {"name": "Iron", "lede": "Violence up close: reading a fight before it starts, hitting hard, and staying on your feet when it goes loud.", "cards": [{"name": "Cover Ground", "level": 1, "recall": 1, "text": "Moving through gunfire doesn't slow you down. <em>Spend a Hope: move anywhere within Far range as part of your action, through fire or over obstacles, with no roll. You can bring one ally with you.<\/em>"}, {"name": "Read the Room", "level": 1, "recall": 0, "text": "When you walk into a place, you know if someone here is ready to hurt people, and roughly who. <em>Spend a Hope: the GM tells you who's armed, who's dangerous, and where the exits are, and you have +1 Evasion against the first of them to attack you this scene.<\/em>"}, {"name": "Shake It Off", "level": 1, "recall": 1, "text": "When you take Severe damage, mark a Stress: it's Major instead."}, {"name": "Iron Fists", "level": 2, "recall": 0, "text": "Your hands are a weapon. When you're not holding another weapon, you can attack with your fists: pick a trait, Melee range, d8+2 physical damage. While you fight bare-handed you have +1 Evasion."}, {"name": "Reckless", "level": 2, "recall": 1, "text": "Mark a Stress: your next attack has advantage."}, {"name": "Marked", "level": 3, "recall": 1, "text": "When you hit someone, mark a Stress to Mark them; you can hold one Mark at a time. Every time you damage a Marked target, add a d4 per tier to the damage. The Mark ends when you rest, when they drop, or when the GM spends Fear equal to your tier."}, {"name": "Sizing Up", "level": 3, "recall": 1, "text": "One look at a crew and you know how tough they are, who's leading, and who's running combat chrome. <em>Spend a Hope: your first attack against any of them this scene has advantage, and the GM tells you which one runs first.<\/em>"}, {"name": "Combo", "level": 4, "recall": 1, "text": "After you deal damage with a Melee attack, mark a Stress to keep hitting. Roll your Combo Die and keep rolling until a result is lower than the last one; add all of it to the damage. Combo Die: d4 at tier 1, d6 at tier 2, d8 at tier 3, d10 at tier 4."}, {"name": "Deadly Focus", "level": 4, "recall": 2, "text": "Once per rest, pick one target. Until they drop, you attack someone else, or the fight ends, your Proficiency is +1."}, {"name": "Clean Hit", "level": 5, "recall": 1, "text": "When you critically succeed on an attack, spend up to 3 Hope, one for each: you clear a Hit Point, you clear an Armor Slot, the target marks one more Hit Point."}, {"name": "Hold Ground", "level": 5, "recall": 1, "text": "When you spend an Armor Slot to drop a hit one step, you can mark a Stress to spend a second and drop it another. Once per rest, when someone within Melee range would deal damage to you, step out of reach instead: you take nothing and move out of Melee."}, {"name": "Break Contact", "level": 6, "recall": 2, "text": "You know when a fight is lost and how to leave it. <em>Once per long rest, everyone with you falls back to Far range, nobody gets a free shot at you, and anyone chasing starts two steps behind (their countdown is 2 higher).<\/em>"}, {"name": "Riposte", "level": 6, "recall": 0, "text": "When a Melee attack against you fails, mark a Stress: hit them back for your weapon's damage."}, {"name": "Iron-Bound", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Iron cards: +2 to your Severe threshold, and once per rest, when you take damage, subtract 1d6 plus your tier from it first."}, {"name": "Surgical", "level": 7, "recall": 1, "text": "When you hit with a weapon, add your Finesse or your Agility to the damage."}, {"name": "Open Them Up", "level": 8, "recall": 2, "text": "When you hit someone, mark a Stress: the next hit on that target, by anyone, deals +2d12."}, {"name": "Rampage", "level": 8, "recall": 3, "text": "<em>Once per long rest, lose it. Until there are no adversaries left in sight, you can't use Armor Slots, you deal +10 damage on every hit, and your Severe threshold is +8.<\/em>"}, {"name": "Reaper's Line", "level": 9, "recall": 3, "text": "<em>Once per long rest, spend a Hope and make an attack roll. The GM tells you which targets in range it would hit. Pick one of them: they mark 5 Hit Points.<\/em>"}, {"name": "Walk It Off", "level": 9, "recall": 2, "text": "<em>Once per long rest, when you mark your last Hit Point (from anything short of Massive Damage), don't make a death move. Clear 2 Hit Points and 2 Armor Slots, stand up, and keep going.<\/em> Works alongside a Trauma Liner, and works first."}, {"name": "Built Different", "level": 10, "recall": 0, "text": "Gain 2 more Hit Point slots and +4 to your Severe threshold. Whenever you roll with Fear on an attack, clear a Stress."}, {"name": "Through the Crowd", "level": 10, "recall": 2, "text": "<em>Spend 3 Hope to run a straight line to a point within Far range, attacking everyone in your weapon's range along the way. Roll your weapon damage once with +1 Proficiency for the first target you hit; drop one die and deal the rest to the next; keep going until the dice run out.<\/em>"}]}, "Ghost": {"name": "Ghost", "lede": "Not being seen, and what you do about it: eyes, blind spots, quiet kills, and leaving no trace behind.", "cards": [{"name": "Knives Out", "level": 1, "recall": 1, "text": "<em>Spend a Hope: throw steel at everyone within Very Close range. Make a Finesse Roll against each; those you beat take d8+2 physical damage using your Proficiency, and a Vulnerable target takes an extra 1d8.<\/em>"}, {"name": "Light Fingers", "level": 1, "recall": 0, "text": "Lockpicks in your hands are faster than a keycard: you have advantage on rolls to open a lock or a panel by hand, and on rolls to take something off a person without them noticing."}, {"name": "Sightlines", "level": 1, "recall": 0, "text": "When you look at a place, you know what can see you: every camera, every sightline, every blind spot. <em>Spend a Hope: the GM tells you a way in or out that nothing watches, and the first roll you make to use it has advantage.<\/em>"}, {"name": "Blind Spot", "level": 2, "recall": 0, "text": "Once per scene, when someone looks right at where you are, mark a Stress: they don't see you. If you're Hidden, you stay Hidden."}, {"name": "Quiet Entry", "level": 2, "recall": 1, "text": "When you're out of sight, mark a Stress to become Hidden without a roll. <em>Spend a Hope: an ally within Very Close range who's also out of sight is Hidden with you.<\/em>"}, {"name": "Chokehold", "level": 3, "recall": 1, "text": "When you get behind someone about your size, mark a Stress to put them in a chokehold: they're Vulnerable, and anyone who hits them while you hold it deals +2d6."}, {"name": "Misdirection", "level": 3, "recall": 1, "text": "A noise, a thrown bottle, a car alarm. Make a Finesse Roll against a guard, a camera operator, or a drone's handler within Far range; beat them and they look the wrong way for one exchange, and everyone with you can move within Close range unseen."}, {"name": "Unnoticed", "level": 4, "recall": 0, "text": "When you roll with Fear while moving unnoticed through a dangerous place, mark a Stress to roll with Hope instead. Mark a Stress to do the same for an ally within Close range."}, {"name": "Weak Point", "level": 4, "recall": 1, "text": "Watch a target within Very Close range for a moment, then <em>spend a Hope: their Difficulty is lower by your Instinct (at least 1) until the scene ends.<\/em>"}, {"name": "Footprint", "level": 5, "recall": 2, "text": "You leave nothing behind. No witness can describe you, no shell casing points at you, no camera profile fits you. <em>Once per long rest, cover the whole crew for a job: it adds no Heat, and any countdown hunting you tonight resets.<\/em>"}, {"name": "The Way Back", "level": 5, "recall": 2, "text": "<em>Spend a Hope where you stand. Any time before your next rest, spend another: you're back at that spot, as long as it's within Far range, and nobody saw you go.<\/em> Then it's spent."}, {"name": "No Noise", "level": 6, "recall": 1, "text": "When you drop a target while Hidden, nobody else notices for one exchange, and you stay Hidden. <em>Spend a Hope: the body isn't found until you want it to be.<\/em>"}, {"name": "Vanishing Crew", "level": 6, "recall": 1, "text": "Mark a Stress: everyone with you within Close range who's out of sight is Hidden without a roll. Start a countdown (4) that ticks when any of you rolls with Fear; when it triggers, one of you has been spotted."}, {"name": "Ghost-Bound", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Ghost cards: once per rest, when you have 0 Hope and the GM would gain a Fear, you gain a Hope instead; and when you hit, mark a Stress to add your Fear Die to the damage."}, {"name": "Not There", "level": 7, "recall": 1, "text": "When an attack against you fails, <em>spend a Hope: you're Hidden, anywhere within Close range of the attacker, until your next action roll.<\/em>"}, {"name": "Ghost Step", "level": 8, "recall": 1, "text": "When you move to Far range by any means (your legs, your chrome, a frame), every attack against you this exchange has disadvantage, and if you end out of sight you're Hidden."}, {"name": "In the Dark", "level": 8, "recall": 1, "text": "In low light or darkness, you have +1 Evasion and your attacks have advantage."}, {"name": "Nightmare", "level": 9, "recall": 3, "text": "<em>Once per long rest, everyone within Very Close range sees what's in the room with them. Each makes a Reaction Roll (16) or is Vulnerable; take a Fear from the GM for each one who failed, roll that many d6, and deal the total to every one of them.<\/em>"}, {"name": "The Toll", "level": 9, "recall": 1, "text": "Name a target within Far range. Each time you succeed on a roll against them that isn't an attack (a tail, a lock, a lie, a read), put a token on this card; when you damage them, spend any number for +1d12 each. One target at a time; clear the tokens when you rest or pick a new one."}, {"name": "A Rumor", "level": 10, "recall": 1, "text": "Mark a Stress: until your next action roll against someone, attacks against you fail, locked doors aren't, and you move within Far range without a roll."}, {"name": "Blackout", "level": 10, "recall": 2, "text": "<em>Once per long rest, kill every light within Far range. Only you and your allies can see: attacks against any of you have disadvantage, and when one of you succeeds with Hope against an adversary in the dark, it marks a Stress. It lasts until the GM spends a Fear or you take Severe damage.<\/em>"}]}, "Forge": {"name": "Forge", "lede": "Fixing, building, salvaging, installing chrome, driving anything with wheels, and treating bodies like the machines they are.", "cards": [{"name": "Diagnosis", "level": 1, "recall": 0, "text": "You can tell what's wrong with any machine or body by looking at it. <em>Spend a Hope: the GM tells you exactly how to fix it and what it will take.<\/em>"}, {"name": "Jury Rig", "level": 1, "recall": 0, "text": "You can make broken gear work again with what's on hand; it holds until the end of the scene. <em>Spend a Hope to make it hold for the day. Mark a Stress to make the fix permanent.<\/em>"}, {"name": "Provision", "level": 1, "recall": 1, "text": "You keep people fed, watered, and supplied where there's nothing: no countdown for food, water, fuel, or ammunition ever ticks against a crew you're looking after. <em>Once per session, produce a fistful of dollars' worth of useful gear from whatever's around: water, a medpatch, a magazine, a tool.<\/em>"}, {"name": "Salvage", "level": 2, "recall": 0, "text": "You pull twice as much scrap from any wreck. <em>Once per scene, pull one working part, load, or fitting out of something that just got destroyed.<\/em>"}, {"name": "Wheel Work", "level": 2, "recall": 1, "text": "You can drive anything with wheels or treads, and you have +1 to chase rolls. <em>Spend a Hope: your vehicle is cover this exchange. Allies next to it get +2 to both damage thresholds, and one ally can act from inside it.<\/em>"}, {"name": "Field Fabricate", "level": 3, "recall": 2, "text": "Give you scrap and an hour and you'll build it. Anything you build is 2 Difficulty easier, and three Shards stand in for a Part. With a diagram, a Tier 1 item takes a short rest."}, {"name": "Hot Modification", "level": 3, "recall": 1, "text": "You tune machines while they're running. <em>Once per scene, as an action, give a machine within Very Close range +1 to its next roll or +2 to its thresholds for the scene.<\/em>"}, {"name": "Body Shop", "level": 4, "recall": 2, "text": "You keep your people running. Allies you look after have advantage on rolls to shake off Offline, and your rolls to treat someone never have disadvantage from the situation. <em>With a Trauma Kit, when you patch someone up outside a rest, they clear 1d4 Hit Points instead of 1.<\/em>"}, {"name": "Implant Work", "level": 4, "recall": 1, "text": "You can install and maintain chrome without a clinic. <em>With a Cyberdoc Kit, installing an augment takes a short rest instead of a project, and chrome you installed never glitches, whoever holds the warranty.<\/em>"}, {"name": "Frame Jockey", "level": 5, "recall": 1, "text": "You live in your frame. A frame you wear costs you no Evasion or Agility, it has one more component slot than listed, and you can swap its components during a short rest instead of at a garage."}, {"name": "Pursuit", "level": 5, "recall": 1, "text": "While you're driving in a chase, your successes tick the countdown twice and the other side's tick it 1 less. Anyone riding with you can act from the vehicle without a roll to hang on."}, {"name": "Overclock", "level": 6, "recall": 1, "text": "Mark a Stress: one weapon, drone, or piece of chrome within Close range deals +1d10 damage or gets +3 to its thresholds until the end of the scene. When the scene ends, it needs a repair before it works again."}, {"name": "Strain Sense", "level": 6, "recall": 1, "text": "You grow medicine, and you know what to do with it. <em>Spend a Hope: mix a dose of any Common or Uncommon drug from Section B out of what's growing nearby, in the middle of a scene. Once per long rest, a Rare one.<\/em>"}, {"name": "Forge-Wrought", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Forge cards: everything you've built or installed gets +1 to its thresholds or +1 to its damage (your choice per item), and once per long rest, any repair takes as long as it takes to describe."}, {"name": "Master Fabricator", "level": 7, "recall": 2, "text": "The clans hand you diagrams for Tier 1, 2 and 3 gear on request, and any Fab Unit you run builds one tier higher than its rating. At a Fab Bench you build in a rest instead of days, and every success on a build counts double."}, {"name": "Chrome Surgeon", "level": 8, "recall": 1, "text": "You can work on a body in the middle of a fight. Mark a Stress: as your action, an ally within Very Close range clears every Offline condition, or clears 2 Hit Points. <em>Once per long rest, give someone one augment more than their slots allow until the next long rest.<\/em>"}, {"name": "Warranty Void", "level": 8, "recall": 2, "text": "<em>Once per long rest, touch a corporate machine or augment within Melee range, yours or theirs. It's yours now: it stops reporting home, and if it belonged to an enemy it goes Offline for the scene and then works for you.<\/em>"}, {"name": "Convoy", "level": 9, "recall": 2, "text": "Your ride is the crew's fortress. Anyone riding in it has +tier to both damage thresholds and acts from it without a roll to hang on. <em>Once per session, a rest inside it counts as a long rest for the whole crew, wherever you're parked.<\/em>"}, {"name": "Second Skin", "level": 9, "recall": 2, "text": "Chrome and frames you maintain get +1 Armor Score and can't be knocked Offline by EMP or gas. <em>Mark a Stress: for a scene, one machine you've worked on (a drone, a car, a frame, a limb) marks only 1 Hit Point per hit.<\/em>"}, {"name": "Miracle Work", "level": 10, "recall": 3, "text": "<em>Once per session, touch a machine or a body: all its Hit Points and Armor Slots clear, every Offline condition ends, and it gets +2 to both thresholds until the session ends.<\/em>"}, {"name": "Reforged", "level": 10, "recall": 1, "text": "When an ally within Close range marks their last Hit Point, you reach them in time. Mark 2 Stress: they clear 3 Hit Points instead of making a death move, and they're back in the fight."}]}, "Wire": {"name": "Wire", "lede": "Drones, turrets, doors, cameras, networks, and the Demons that guard them. Machines that do what they were told, and making them do what you tell them.", "cards": [{"name": "Instruction Set", "level": 1, "recall": 0, "text": "You can rewrite what a machine does. Given time with a drone, a turret, a door, or a car, change one thing about how it behaves (what it watches for, who it lets through, what it does when alarmed). The change lasts until someone resets it."}, {"name": "Market", "level": 1, "recall": 1, "text": "You know who sells what in the grey market. <em>Once per session, get your hands on one load, part, or diagram of your tier or lower, inside the scene.<\/em>"}, {"name": "Network Read", "level": 1, "recall": 0, "text": "Look at a building, a network, or a zone and you know its shape: how big, how tough (its tier and Difficulty), where the wires run, and what its properties are. <em>Spend a Hope: the GM tells you what lives in it, what it does first, and where the control room is, and your first roll against it this scene has advantage.<\/em>"}, {"name": "Many Hands", "level": 2, "recall": 0, "text": "You can control up to three machines at once without losing track of any of them. <em>Spend a Hope: five, for the scene.<\/em>"}, {"name": "Tripwire", "level": 2, "recall": 0, "text": "Rig a machine or a system so it tells you when someone touches it. <em>Once per scene, when someone tampers with something you've rigged, mark a Stress: it bites them for 2d6 damage and you know exactly where they are.<\/em>"}, {"name": "Demon Psychology", "level": 3, "recall": 0, "text": "You know how Demons, net-AI, and unmanned machines think: what they chase, what they ignore, what sets them off. The GM tells you a Demon's or an unmanned machine's next move before you commit. <em>Spend a Hope: it takes the bait, and acts against a target you choose instead.<\/em>"}, {"name": "Hardened", "level": 3, "recall": 1, "text": "Machines you lock down are hard to hack: deck rolls against them are 4 Difficulty harder, and you get a ping the moment someone tries. Mark a Stress: lock down one machine or one building's system until your next long rest."}, {"name": "Bounce", "level": 4, "recall": 1, "text": "When an attack from beyond Melee range fails against you, roll a d6 per Proficiency. If any shows a 6, mark a Stress: a machine you control within Close range returns fire, dealing its weapon damage to the attacker."}, {"name": "Signal Discipline", "level": 4, "recall": 1, "text": "You're quiet in the net. Routine scans don't find you, and nobody's scanner learns your name from a quickhack or from a machine you're running. <em>Spend a Hope: for the scene, you and the machines you control have advantage on rolls to avoid a Demon, and a failure with Fear ticks the Consequence countdown 2 instead of 3.<\/em>"}, {"name": "Handwriting", "level": 5, "recall": 0, "text": "You can tell another operator's work on sight, in a network or in a rigged machine. Spend any number of Hope and ask that many: how good are they, have I met their work, what do they want, will they know I was here. When you meet them, in the net or in the flesh, you have +1 Evasion against them and your first roll against their work has advantage."}, {"name": "System Understanding", "level": 5, "recall": 1, "text": "You know what a machine is thinking right now. <em>Once per scene, mark a Stress: a machine within Close range freezes and loses its next turn.<\/em>"}, {"name": "Override Protocol", "level": 6, "recall": 2, "text": "Hardening doesn't stop you. A locked-down machine's +4 Difficulty is 0 against you, and the ping goes to you instead of the owner."}, {"name": "Turret Mind", "level": 6, "recall": 1, "text": "<em>Spend 2 Hope: every machine you control fires at once. Make one attack roll; each machine you control hits a different target in its range on a success.<\/em>"}, {"name": "Black Ice Heart", "level": 7, "recall": 1, "text": "When you take feedback damage in the net, or a machine you control is destroyed, put a token on this card for each Hit Point you marked or each machine you lost (up to your Knowledge plus 2). When you hit a Demon, a construct, or a machine, spend any number of tokens to add a d6 each to the damage."}, {"name": "Wire-Bound", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Wire cards: once per scene, each machine you control acts without you spending your turn on it, and when a deck roll fails with Fear against a machine you've worked on, the Consequence countdown doesn't tick."}, {"name": "Puppet Master", "level": 8, "recall": 2, "text": "<em>Once per long rest, make a Knowledge Roll against every drone and turret within Far range. Each one you beat is yours until the end of the scene, up to 2 per tier. When you command them to attack, every one of them in range of the target attacks together: one roll, and add their damage together.<\/em>"}, {"name": "Steal the Fear", "level": 8, "recall": 2, "text": "<em>Once per long rest, in the net or through a machine you control, make a Knowledge Roll (16). On a success, take Fear from the GM's pool equal to your tier; roll a d6 for each Fear you took and deal that much direct damage to a Demon, a construct, or a machine within Close range.<\/em>"}, {"name": "Kill Switch", "level": 9, "recall": 2, "text": "Every machine you've ever touched is yours if you need it. <em>Once per session, every device you've hacked, hardened, or rewritten this campaign either shuts down or obeys one order, all at once. Tier 4 gear gets a Knowledge Reaction Roll (20).<\/em>"}, {"name": "Overwatch", "level": 9, "recall": 1, "text": "Every camera, drone, and sensor you have access to is your eyes. Allies within Far range that you can see have +1 Evasion, and once per scene you tell an ally exactly where to shoot: their next attack has advantage and does +1d8."}, {"name": "Deep Current", "level": 10, "recall": 3, "text": "<em>Once per long rest, grab a target within Close range, with your hands or with a machine you control, and drag them into the net with you. You and they play out the next exchange in a zone the GM describes; whatever damage they take there they take for real, and they come back Vulnerable.<\/em>"}, {"name": "Machine God", "level": 10, "recall": 0, "text": "<em>Mark a Stress: for the scene, every machine within Far range answers to you. Adversary machines get one Knowledge Reaction Roll (18); if they fail, they're yours. When the scene ends, mark 3 Stress.<\/em>"}]}, "Archive": {"name": "Archive", "lede": "Finding out. Records, recordings, rumors, buried data, and the memories a dive leaves behind, whether it's in a filing cabinet or a cache at the bottom of the net.", "cards": [{"name": "Call It", "level": 1, "recall": 0, "text": "Fakes don't get past you: you can tell a doctored recording, a planted file, or a forged document on sight. <em>Spend a Hope: you say so out loud, everyone who heard you believes it, and whoever showed it to you marks a Stress.<\/em>"}, {"name": "Nose", "level": 1, "recall": 0, "text": "You know when something's worth pursuing: the hole in the official story, the thing nobody's covering. <em>Spend a Hope: the GM tells you which thread to pull and what the statement is hiding, and the first roll you make on that thread has advantage.<\/em>"}, {"name": "The Scene", "level": 1, "recall": 1, "text": "You're known in a community: hackers, journalists, the Shade, whichever is yours. Anywhere it exists, you can find its people. <em>Once per session, someone in it hands you a lead on what you're working on.<\/em>"}, {"name": "Deep Search", "level": 2, "recall": 1, "text": "If it's ever been recorded, filed, or posted anywhere, you can find it. <em>Spend a Hope: the GM hands you the one thing everyone else missed in the archive, the net, or the paper trail, and the first roll you make on it has advantage.<\/em>"}, {"name": "Fingerprints", "level": 2, "recall": 0, "text": "Hand you a file, a recording, or a memory and you can tell where it came from, who edited it, and when. <em>Spend a Hope: if the file is in your hands, the edit is undone and you have the original.<\/em> A memory you can only read."}, {"name": "Follow the Paper", "level": 3, "recall": 1, "text": "Every company leaves a paper trail whether it wants to or not. Start from one document: <em>spend a Hope per step, and each step the GM names the next hand it passed through,<\/em> until you reach the person who signed for it."}, {"name": "Untraceable", "level": 3, "recall": 2, "text": "Nothing that sees you in the net can find you again: after a run, no record of you exists, and identifying you from what's left is +4 Difficulty. Mark a Stress: do this through a network whose Demon is awake."}, {"name": "Kill File", "level": 4, "recall": 1, "text": "You keep damaging facts you've chosen not to publish. Keep a <strong>Kill File<\/strong> count on your sheet, up to your Presence plus 2; add one whenever you verify something someone wants buried. <em>Spend one: a person in your file does one thing you ask.<\/em>"}, {"name": "On the Record", "level": 4, "recall": 1, "text": "Once something's on the record, it's hard to kill. Mark a Stress to publish or file a fact: discrediting it takes a Knowledge Roll (18), and it survives any one takedown."}, {"name": "Cross-Check", "level": 5, "recall": 1, "text": "Once per rest, put what you've got side by side and ask the GM 3 yes-or-no questions; they answer as far as any record shows, and tell you where the record runs out. If an answer catches someone in a lie, mark a Stress to take a Fear out of the GM's pool."}, {"name": "Unpick", "level": 5, "recall": 2, "text": "You can undo what someone did to a mind. <em>Once per long rest, spend an hour with a person: remove one frag Experience or one memory someone edited into them, and they clear 3 Stress.<\/em>"}, {"name": "Deep Cache", "level": 6, "recall": 2, "text": "You know where the valuable data is hidden, in the net and in the city, and you take it without leaving fingerprints. <em>Once per long rest, dig one up: a case of dollars' worth of data, or a Backdoor into a real place the GM names. Spend a Hope: pull a cache out of a system or zone that's collapsing around you, intact.<\/em>"}, {"name": "Receipts", "level": 6, "recall": 1, "text": "When someone lies in front of you and you can prove it, they mark 2 Stress, and everyone within Close range who heard it has to pick a side. <em>Spend a Hope: you have the proof on you.<\/em>"}, {"name": "Archive-Bound", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Archive cards: once per scene, ask the GM one factual question about what's going on and get a true answer, and nobody can call your evidence fake without a Knowledge Roll (18) against you."}, {"name": "Integration", "level": 7, "recall": 2, "text": "After a dive, or a run that cost you, you choose which memory you keep, and whether it becomes a frag Experience at all. <em>Once per long rest, keep a run as a recording instead: no frag, you gain a Hope, and you can play it for someone.<\/em>"}, {"name": "Blue Recognition", "level": 8, "recall": 1, "text": "You've been deep enough to know when a place is pretending. When your crew enters a network, a zone, or a building that isn't what it says it is, you know at once. <em>Spend a Hope: the GM tells you what's wrong with it, and for the scene its Demon or its security is 2 Difficulty easier for you.<\/em>"}, {"name": "The Whole Story", "level": 8, "recall": 2, "text": "<em>Once per long rest, start a countdown (3) that ticks each scene. Each tick, the GM answers one question with what actually happened, as far as any record, witness, or construct shows, including the parts nobody's put together yet.<\/em>"}, {"name": "Black Archive", "level": 9, "recall": 3, "text": "<em>Once per long rest, produce the evidence that ends someone. An adversary of your tier or lower whose name is on it either stops acting against the crew for the session, or marks 4 Stress to keep going.<\/em>"}, {"name": "Unwipeable", "level": 9, "recall": 2, "text": "Nothing you've recorded or saved can be destroyed, edited, or buried; copies keep surfacing, and discrediting any of it takes a Knowledge Roll (24). <em>Once per long rest, recover something erased: a wiped log, a deleted feed, a memory someone paid to remove from a person.<\/em>"}, {"name": "The Record Speaks", "level": 10, "recall": 3, "text": "<em>Once per session, make a truth public in a way nobody can walk back: a faction countdown ticks 2 the way you want, a cover story dies, or a name becomes unhirable. The GM tells you who comes looking for the source.<\/em>"}, {"name": "The Truth Comes Out", "level": 10, "recall": 0, "text": "Mark a Stress and say one true thing about someone within Far range who can hear you: everyone present knows it's true. If it hurts them, they mark 2 Stress and lose their next turn."}]}, "Voice": {"name": "Voice", "lede": "Talking your way in, out, and up. Reading people, working a crowd, keeping a cover, and making someone sweat.", "cards": [{"name": "Enrapture", "level": 1, "recall": 0, "text": "Make a Presence Roll against a person within Close range. Beat them, and they can see and hear only you until you act against them or they take damage. <em>Once per rest, when you beat them, mark a Stress: they mark one too.<\/em>"}, {"name": "Read", "level": 1, "recall": 0, "text": "You can tell what someone wants from a conversation and whether they've been trained to lie. <em>Spend a Hope: the GM tells you what they're afraid of, and your first Presence Roll against them has advantage.<\/em>"}, {"name": "Sources", "level": 1, "recall": 1, "text": "You have people who tell you things they shouldn't, because you've never burned one. <em>Once per long rest, a source reaches out with something you didn't ask for and needed.<\/em>"}, {"name": "False Warmth", "level": 2, "recall": 0, "text": "You can smell a con: friendliness that arrives too fast, questions that collect instead of connect. When someone tries to deceive you, you have advantage on the roll to see through it. <em>Spend a Hope: when you catch them, they mark a Stress.<\/em>"}, {"name": "Walk In", "level": 2, "recall": 1, "text": "You show up as exactly the person you need to be. The first check on your right to be somewhere (a door, a guest list, a look from security) passes without a roll. <em>Spend a Hope: so does the second.<\/em>"}, {"name": "Home Turf", "level": 3, "recall": 1, "text": "On a street you know, you and allies within Close range have +1 Evasion. <em>Spend a Hope: a crowd swallows you and you're Hidden.<\/em>"}, {"name": "Recovery", "level": 3, "recall": 1, "text": "When a room turns cold, you don't. <em>Once per scene, when a Presence Roll fails with Fear, mark a Stress to make it a failure with Hope: you didn't get what you wanted, but nobody's onto you and the GM gains no Fear.<\/em>"}, {"name": "Coverage", "level": 4, "recall": 1, "text": "You keep your people in frame. While an ally within Close range is in public with you, anyone who wants to hurt them spends a Fear first. <em>Spend a Hope: when someone does spend it, everyone watching saw — they mark a Stress.<\/em>"}, {"name": "Pressure", "level": 4, "recall": 1, "text": "You know exactly where to push. <em>Spend a Hope: when you succeed on a Presence Roll against someone, they also mark a Stress and are Vulnerable until their next turn.<\/em>"}, {"name": "Rumor Mill", "level": 5, "recall": 1, "text": "<em>Once per long rest, start a rumor. Start a countdown (4) that ticks each scene; when it triggers, a person or faction you name has acted on the rumor as if it were true.<\/em>"}, {"name": "Second Life", "level": 5, "recall": 2, "text": "You keep one fake identity so real it has friends; write it on your sheet with a countdown (6) that ticks only when you fail with Fear while wearing it. Presence Rolls as that person are +2, and when the countdown triggers the cover is burned. If your Path already gave you a fake identity, this card is that identity: it gains the +2 and the countdown."}, {"name": "Public Face", "level": 6, "recall": 2, "text": "Your public role (a show, a brand, a reputation) is armor. Anything you do in that role adds 1 less Heat, and adversaries must spend a Fear to move against you anywhere a camera could be."}, {"name": "Talk It Out", "level": 6, "recall": 0, "text": "Once per rest, sit with a willing ally within Melee range and let them say what they've been carrying. Move any number of their marked Stress to you, and gain a Hope for each."}, {"name": "Voice-Carried", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Voice cards: whenever you succeed with Hope on a Presence Roll against someone, they either mark a Stress or you get advantage on your next roll against them (your choice), and once per session, a crowd within Far range treats you like someone it already trusts."}, {"name": "Work the Crowd", "level": 7, "recall": 2, "text": "<em>Once per scene, address everyone within Close range who can hear you: either all your allies clear a Stress, or all your adversaries mark one. Your call.<\/em>"}, {"name": "Call Them Out", "level": 8, "recall": 1, "text": "<em>Spend a Hope and make a Presence Roll against one person within Far range who can hear you, in front of others. Beat them, and they mark 2 Stress and are Vulnerable; beat them with Hope, and the room turns on them: they can't act against anyone but you until someone takes a hit.<\/em>"}, {"name": "Hold the Room", "level": 8, "recall": 3, "text": "<em>Make a Presence Roll against everyone within Far range. Those you beat are fixed on you: they can't act against anyone else while you keep talking. Mark a Stress to make all of them mark a Stress, which ends it.<\/em>"}, {"name": "Notorious", "level": 9, "recall": 0, "text": "People know who you are and what you've done. When you lean on your reputation to get what you want, mark a Stress before you roll for +10 to the result. Your drinks are always free, and everything else costs a stack less (down to a fistful)."}, {"name": "The Exposure", "level": 9, "recall": 2, "text": "You make something impossible to ignore. <em>Once per long rest, start a countdown (3) that ticks each scene. When it triggers, the story is everywhere: a faction countdown ticks 1 the way you want, and every adversary it names marks 2 Stress.<\/em>"}, {"name": "Cult of Personality", "level": 10, "recall": 1, "text": "Mark a Stress: for the scene, a crowd within Far range is yours. They block a door, swarm a guard, carry you out, or swear you were never there, and an adversary who wants through them marks a Stress first. They don't fight for you."}, {"name": "Voice of the Shade", "level": 10, "recall": 3, "text": "<em>Once per session, a crowd, a block, or an audience does what you ask for the scene, and a gang set or a security detail you name switches to your side. If it hits the feeds, Heat +1, and it hits the feeds.<\/em>"}]}, "Ledger": {"name": "Ledger", "lede": "Corporations, contracts, money, and the people who sign things. Getting inside the machine and making it work for you.", "cards": [{"name": "Loophole", "level": 1, "recall": 0, "text": "Every rule has an exception and you know where it is. <em>Spend a Hope: one of a corporation's rules (a clearance, a curfew, a checkpoint policy) doesn't apply to you for the scene.<\/em>"}, {"name": "Terms", "level": 1, "recall": 1, "text": "You close deals. When two parties agree through you, both sides gain a Hope. Mark a Stress to make a deal binding: whoever breaks it first marks 2 Stress, and everyone finds out."}, {"name": "Who's Really In Charge", "level": 1, "recall": 0, "text": "Look at any company, department, or crew and you know who actually runs it, whatever the titles say. <em>Spend a Hope: the GM tells you the one person who can sign what you need and what they want for it, and your first Presence Roll against them has advantage.<\/em>"}, {"name": "Company Card", "level": 2, "recall": 1, "text": "You know how to make a corp pay for things. <em>Spend a Hope: a corporation you've dealt with covers something worth a fistful of dollars, through channels that look legitimate — a ride, a room, a meal, a tool. Mark a Stress: a stack's worth.<\/em>"}, {"name": "Laundered", "level": 2, "recall": 1, "text": "Money you move through corporate channels comes out clean. Anything you route this way takes a Knowledge Roll (18) to trace back to you."}, {"name": "Blackmail", "level": 3, "recall": 1, "text": "When you learn something a corporate person wants buried, they're yours. <em>Spend a Hope: they mark 2 Stress and do one thing you ask, right now.<\/em>"}, {"name": "Get It Upstairs", "level": 3, "recall": 1, "text": "You know which channels actually reach a decision-maker. <em>Spend a Hope: put something in front of the person who matters, unfiltered. Start a countdown (2) that ticks each scene; when it triggers, they've read it and acted on it.<\/em>"}, {"name": "Long Game", "level": 4, "recall": 1, "text": "You keep people close for years. <em>Once per session, a contact you've built up does something for you without being asked, right when it matters.<\/em>"}, {"name": "Who Owns It", "level": 4, "recall": 1, "text": "You can find the real owner behind any company, building, or badge. <em>Spend a Hope per question — who controls it, who funds it, who it answers to — and the GM answers one per Hope.<\/em> The first roll you make on an answer has advantage."}, {"name": "Leverage", "level": 5, "recall": 1, "text": "You know what a corporate person can lose. <em>Spend a Hope: someone who works for a corporation does one real thing for you — opens a door, signs a form, loses a file — and marks a Stress. If they refuse, they mark 3 Stress instead, and the GM tells you what they're protecting.<\/em>"}, {"name": "Shell Company", "level": 5, "recall": 2, "text": "You can stand up a fake company that looks real and works. <em>Once per long rest, create one. Seeing through it takes a Knowledge Roll (18), and it holds until someone does.<\/em>"}, {"name": "Golden Parachute", "level": 6, "recall": 2, "text": "<em>Once per long rest, when the crew is about to lose (cornered, captured, broke), you buy the exit. Pay a case ($10,000) or take on a debt the GM names: everyone with you leaves the scene safely.<\/em>"}, {"name": "Inside Man", "level": 6, "recall": 2, "text": "You have real reach into one corporation you name. Rolls inside it are at +2. <em>Once per long rest, its security treats you as staff for a scene.<\/em>"}, {"name": "Ledger-Bound", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Ledger cards: no corporation you've dealt with can surprise you (the GM warns you when one is about to move against the crew), and once per long rest, move a stack of dollars from any corp's books to yours, no roll."}, {"name": "Owned", "level": 7, "recall": 1, "text": "Inside one corporation you name, you're a known face. Mark a Stress: walk in the front door, past everything, to the room you want, and its staff treat the crew as yours for the scene. <em>Once per session, its own security escorts you out of trouble.<\/em>"}, {"name": "Hostile Takeover", "level": 8, "recall": 2, "text": "<em>Once per long rest, one corporate asset of your tier or lower — a department, a security team of up to 6, a clinic, a fleet of up to 6 drones, a warehouse — is yours for the session. It takes your orders and nobody else's. Afterward, a countdown (2) ticks each scene before someone notices.<\/em>"}, {"name": "Insured", "level": 8, "recall": 1, "text": "<em>Spend 2 Hope: for the scene, the crew is on a corporation's policy. Every ally within Far range clears an Armor Slot now, and the first time each of them would mark Hit Points this scene, they mark one fewer.<\/em>"}, {"name"
