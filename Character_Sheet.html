: "Blank Check", "level": 9, "recall": 2, "text": "<em>Once per session, money is no object. Buy anything that has a price, at any price, including silence, and the GM describes it arriving this scene. Anyone you paid who tries to back out marks 3 Stress.<\/em>"}, {"name": "Paper Empire", "level": 9, "recall": 1, "text": "Your shell companies are real and they make money. Mark a Stress: the paper produces something worth a stack ($1,000) right now — the cash, a rental, a badge, a ride. <em>Once per long rest, a case ($10,000): a vehicle, a leased building, a clearance.<\/em>"}, {"name": "Majority Shareholder", "level": 10, "recall": 1, "text": "You own a piece of a Tier 4 corporation. Mark a Stress: one of its assets — a security team, a lawyer, a clinic, a stack of dollars — is at your disposal for the scene. The GM can spend 3 Fear to make it refuse."}, {"name": "The Board", "level": 10, "recall": 3, "text": "<em>Once per session, for one decision, you are the corporation: what you sign, it did. A contract voided or made, a subsidiary sold, a policy rewritten, a person hired or fired. A Tier 4 corporation gets a countdown (3) that ticks each scene before it realizes it wasn't them.<\/em>"}]}, "Command": {"name": "Command", "lede": "Taking charge. Setting the terms, carrying a name, and making people follow orders, whether they're a security team or a boardroom.", "cards": [{"name": "Headcount", "level": 1, "recall": 0, "text": "In any standoff you know how many there are, which side they're on, and who's giving orders. <em>Spend a Hope: the GM tells you who breaks first and who's about to move, and your first roll against whoever breaks first has advantage.<\/em>"}, {"name": "Rules of the Game", "level": 1, "recall": 1, "text": "When you state the terms of a meeting, a deal, or a fight out loud, anyone present who breaks them marks a Stress. The terms have to be something they could plausibly agree to."}, {"name": "Weight", "level": 1, "recall": 0, "text": "People who know the life can tell what you are: +1 to Presence Rolls with other professionals, whether that's runners or executives. <em>Spend a Hope: someone who knows what you are backs down or defers.<\/em>"}, {"name": "Bury Them in Process", "level": 2, "recall": 1, "text": "You can turn a corporation's own rules against it. Mark a Stress: tie a corp up in its own paperwork. Start a countdown (4) that ticks each scene; until it triggers, it can't act against the crew through official channels."}, {"name": "Professional Courtesy", "level": 2, "recall": 0, "text": "You know the codes professionals live by, on the street and in the tower. When you make a Presence Roll against another professional, spend a Hope to add your Strength to it. Once per rest, when you'd gain a condition, describe how your standing spares you and don't."}, {"name": "Boardroom Voice", "level": 3, "recall": 1, "text": "You know what a corporation is afraid of: liability, revenue, reputation. +2 to Presence Rolls against a corp or its officers."}, {"name": "Controlled Terms", "level": 3, "recall": 1, "text": "Before a fight, you set the ground. <em>Spend a Hope and choose one for the scene: no adversary can target the person you name in the first exchange, or every adversary marks a Stress to get into Melee with you.<\/em>"}, {"name": "Playbook", "level": 4, "recall": 1, "text": "After two exchanges with an organized group, you have their playbook: allies have +1 to attack them and they're 1 Difficulty easier. <em>Once per scene, mark a Stress to call their next move: the GM's next spotlight on them is cancelled.<\/em>"}, {"name": "Standing Orders", "level": 4, "recall": 1, "text": "Your crew fights as a unit. When you Help an Ally, they can spend a Hope to add one of your Experiences to their roll as well. Once per scene, when an ally within Close range fails a roll, mark a Stress: they roll again."}, {"name": "Act Like You Own It", "level": 5, "recall": 2, "text": "You can walk into a corporation and act like you run it. <em>Once per long rest, be someone with authority there for a countdown (4) that ticks on rolls with Fear. Until it triggers, staff obey you and security stands aside.<\/em>"}, {"name": "Earned Silence", "level": 5, "recall": 1, "text": "Your name opens doors. <em>Once per session, call in a professional debt: one obstacle of Difficulty 20 or lower that a professional could remove is removed. No roll.<\/em>"}, {"name": "Rules of Engagement", "level": 6, "recall": 2, "text": "<em>Once per long rest, before a fight starts, declare the rules out loud: no civilians, no explosives, nobody leaves, first blood ends it. Any adversary who breaks them marks 2 Stress and loses their next turn. Any ally who keeps them gains a Hope the first time it costs them.<\/em>"}, {"name": "Walk Away Clean", "level": 6, "recall": 2, "text": "You know how to end things. <em>Once per long rest, leave any agreement or standoff with no consequences: no Heat, no clock ticks, nobody following.<\/em>"}, {"name": "Chain of Command", "level": 7, "recall": 2, "text": "<em>Once per long rest, give an order to an organized group (a security team, a gang set, a squad, a department) and they follow it as if it came from their own boss. Their leader gets a Presence Reaction Roll (18) to countermand it, but only after it's been obeyed once.<\/em>"}, {"name": "Command-Born", "level": 7, "recall": 2, "text": "While 4 or more of your active cards are Command cards: allies within Close range who can hear you get +1 to reaction rolls, and once per scene, when the GM spends Fear to spotlight an adversary, you can mark a Stress to give that spotlight to an ally instead."}, {"name": "Battle Cry", "level": 8, "recall": 2, "text": "<em>Once per long rest, when you lead the crew into danger, every ally who can hear you clears a Stress and gains a Hope, and they all have advantage on attack rolls until someone fails with Fear.<\/em>"}, {"name": "Hold the Line", "level": 8, "recall": 1, "text": "<em>Spend a Hope and describe the stance you take. Any adversary who comes within Very Close range is pulled into Melee with you and Restrained. It lasts until you move, fail with Fear, or the GM spends 2 Fear.<\/em>"}, {"name": "Lead by Example", "level": 9, "recall": 1, "text": "When you deal damage to an adversary, mark a Stress and say how you rally the crew: the next ally to attack that adversary clears a Stress or gains a Hope."}, {"name": "The Name", "level": 9, "recall": 2, "text": "Your reputation does the fighting. Anyone who knows who you are marks a Stress the first time they act against you in a scene. <em>Once per session, when adversaries who know your name see you, they choose: leave, or mark 3 Stress to stay.<\/em>"}, {"name": "General", "level": 10, "recall": 1, "text": "<em>Spend 3 Hope: every ally within Far range takes an extra action right now, in the order you call.<\/em>"}, {"name": "The Order", "level": 10, "recall": 3, "text": "<em>Once per session, give one order. Everyone within Far range who can hear you obeys it for one action, adversaries included. Tier 4 adversaries get a Presence Reaction Roll (20).<\/em>"}]}}, "upbringings": [{"name": "The Shade", "text": "<strong>Under the Parks.<\/strong> You can't get lost under the SkyParks. Once per session, you know a <em>blind<\/em> in the Shade: a squat off every sensor grid and patrol route.", "words": "stubborn, loyal, watchful, wry, resourceful, tired"}, {"name": "The Loop", "text": "<strong>The Code.<\/strong> Kids in the Loop grow up on rules. Write down three that your family, your school, or your company drilled into you. Once per rest, when you act on one of them, roll a d20 as your Hope Die.", "words": "polished, ambitious, careful, principled, cold, persuasive"}, {"name": "Skyward", "text": "<strong>Cleared.<\/strong> You have advantage on rolls to move among the rich, negotiate a price, or lean on your family's name.", "words": "poised, entitled, charming, sheltered, sharp, generous"}, {"name": "Lakefront North", "text": "<strong>Family Archive.<\/strong> You have advantage on rolls about the history, money, or politics of a notable person, company, or place in Chicago.", "words": "cultured, guarded, curious, precise, private, proud"}, {"name": "The Belt", "text": "<strong>Belt Rules.<\/strong> You have advantage on rolls to deal with criminals, spot a lie, or find somewhere safe to lie low.", "words": "streetwise, calculating, easygoing, connected, shrewd, tenacious"}, {"name": "The Brickyards", "text": "<strong>Yard Legs.<\/strong> You have advantage on rolls to climb, balance, or keep your footing on rail yards, catwalks, loading docks, and anything industrial that moves.", "words": "hardy, blunt, practical, loyal, reserved, strong-willed"}, {"name": "The Outer Skirts", "text": "<strong>Hard Luck.<\/strong> When you roll with Fear, put a token on this feature, up to your level. Before an action roll, spend any number of them for +1 each. Clear them at the end of the session.", "words": "weathered, self-reliant, wary, patient, resilient, unfussy"}, {"name": "A Clan Convoy", "text": "<strong>Road Pack.<\/strong> You carry a clan road pack. Once per session, spend a Hope to pull out one ordinary, useful thing; work out with the GM what it is.", "words": "inscrutable, generous, mirthful, reliable, savvy, unorthodox"}, {"name": "Night City", "text": "<strong>I've Seen This.<\/strong> When the GM spends Fear to escalate a scene, you can mark a Stress to have seen it coming: you and one ally within Close range act before it lands.", "words": "haunted, quick, cynical, protective, restless, unshockable"}], "formerLives": [{"name": "Runner", "text": "<strong>Know a Guy.<\/strong> Once per session, name a runner, fence, ripper, or fixer you already know in the part of the city you're in. The GM makes them real, and you get a warm start.<br><strong>Job-Hardened.<\/strong> Gain an additional Stress slot at character creation."}, {"name": "Corporate", "text": "<em>Name the company.<\/em><br><strong>House Style.<\/strong> You have advantage on rolls to pass as staff, read a corporate space, or move through your company's property without being questioned.<br><strong>Benefits Package.<\/strong> A lifetime of company clinics: gain an additional Hit Point slot at character creation."}, {"name": "Soldier", "text": "<em>Militech, a private army, or the war.<\/em><br><strong>Read the Op.<\/strong> You have advantage on rolls to predict what military or corporate security will do next, and you know Militech-grade hardware on sight.<br><strong>Hold Together.<\/strong> Spend 3 Hope to halve incoming physical damage."}, {"name": "Ganger", "text": "<em>Name your old set.<\/em><br><strong>Colors.<\/strong> You have advantage on rolls to intimidate someone, or to deal with any gang, where your old set's name means something.<br><strong>Street Fighter.<\/strong> When you hit someone in Melee, spend a Hope to add 1d6 to the damage."}, {"name": "Newsroom", "text": "<em>NBN, or independent.<\/em><br><strong>Press Pass.<\/strong> You have advantage on rolls to be somewhere with a camera and a reason, and your recordings are hard to make disappear.<br><strong>Always Rolling.<\/strong> Once per session, after a scene, you have a recording of it: the GM tells you one thing it caught that you missed."}, {"name": "Clan Operative", "text": "<strong>Walk Between.<\/strong> You have advantage on rolls to pass as an ordinary city resident to people who don't know what you are.<br><strong>Tested.<\/strong> When you roll with Fear, you can mark 2 Stress to make it a roll with Hope instead."}, {"name": "Groundskeeper", "text": "<strong>Keys to the Ceiling.<\/strong> Once per session, your maintenance access opens a door, a hatch, or a service corridor nobody expected you to have: anywhere in the SkyParks, and in any building with a service level if the GM agrees.<br><strong>Heights.<\/strong> You have advantage on rolls to climb, balance, or move on ledges, catwalks, and rooftops."}, {"name": "Arcade Diver", "text": "<em>An Elysian leaderboard name.<\/em><br><strong>High Score.<\/strong> When you make a roll while a countdown is running, you can spend 2 Hope to reroll your Hope Die.<br><strong>Zero Lag.<\/strong> Mark a Stress to gain advantage on a reaction roll."}, {"name": "Clinic Hand", "text": "<em>A Shade clinic, or a ripper's back room.<\/em><br><strong>Night Shifts.<\/strong> When you take a short rest, you can choose a long rest move instead of a short rest move.<br><strong>Steady Hands.<\/strong> When you would mark a Stress, roll a d6. On a 6, don't mark it."}], "conversions": [{"name": "Sleeved", "opener": "You are an engram running a body that isn't the one you were born in. Maybe yours died. Maybe it was sold. Maybe you were never anything but the copy.", "text": "<strong>Unfinished Business.<\/strong> Work with the GM to decide what you are still here to do. When it's done, you choose: pass into the net for good, or stay in the sleeve and give up this card for a new Experience at +3.<br> <strong>Data First.<\/strong> Your engram is the real you and the body is a peripheral. You have advantage on rolls to resist quickhacks, engram edits, and anything that targets a mind. Once per long rest, when you mark your last Hit Point, you can mark 2 Stress to be already backed up: the sleeve dies, and you wake in the net, a fridge, or another body the GM names, with 1 Hit Point and all your Stress marked.<br> <strong>The Burden.<\/strong> The sleeve's augments are the sleeve's; they stay with the body. The body has a warranty and a previous owner. It reads as them to every scanner, its augments are theirs, and once per session the GM can spend a Fear to have someone recognize the face."}, {"name": "Full-Body Conversion", "opener": "A chassis, not a skeleton. Your brain and spinal column, and a great deal of Militech-grade engineering.", "text": "<strong>Chassis.<\/strong> Gain +3 to both damage thresholds and +1 Armor Score, and you're immune to poison, gas, and less-lethal weapons. You count as a machine for quickhacks: neural loads work on you, and so do device quickhacks.<br> <strong>Won't Stay Dead.<\/strong> When you choose Risk It All and fail, you can permanently mark a Hit Point slot to succeed instead; you still use the Hope Die's value to clear Hit Points and Stress. When you permanently mark your last slot, the chassis is done.<br> <strong>The Burden.<\/strong> During a rest, you can clear Hit Points only with parts: a Ripper, a Fab Bench, or salvage from a wreck of your tier. Describe the repair. No parts, no healing. Every ripper in the city knows what you are on sight."}, {"name": "Passenger", "opener": "There is a second engram in your head. A construct, a copy, a dead friend, a stranger, a corporate asset that got loose. It has opinions.", "text": "<strong>The Passenger.<\/strong> Write their name on your sheet and work with the GM on their <em>sphere<\/em>: what they know and want (Violence, Money, the Net, the Old Days, Revenge, Faith, the Road). Before an action roll in their sphere, you can spend a <strong>Favor<\/strong> to roll your Passenger Die (d6; d8 from level 5) and add it.<br> <strong>Favor.<\/strong> Start with 3. Use a downtime move to give the Passenger something they want (a visit, a message, a body count, a screen) and gain Favor equal to your Presence. When you succeed with Hope, you can take a Favor instead of a Hope.<br> <strong>The Burden.<\/strong> When you fail with Fear, the Passenger can act: the GM narrates one thing you did or said that you didn't choose. When your Favor is 0, the GM can spend a Fear to have the Passenger take the spotlight in your body for one action."}, {"name": "Prototype", "opener": "You are a corporate asset. Something in you is worth more than you are, and someone holds the paper.", "text": "<strong>Gifted.<\/strong> Gain +1 to action rolls, reaction rolls, and damage rolls.<br> <strong>The Burden.<\/strong> When you fail a roll, mark a Stress or the GM gains a Fear, on top of any Fear the roll already gave them. The corp that made you knows where you are to within a district, and once per session the GM can put someone in the scene who's there to check on the investment."}, {"name": "Combat Chassis", "opener": "Military wetware with a mode you didn't ask for. When the body decides it's a fight, it stops asking.", "text": "<strong>Overdrive.<\/strong> When you mark 1 or more Hit Points, you can mark a Stress to go into Overdrive. While in it, gain a bonus to attack rolls equal to your tier and a 1d6 bonus to damage rolls. When you roll with Hope in Overdrive, you must mark a Stress. It lasts until you rest or until Burnout.<br> <strong>Burnout.<\/strong> When you mark your last Stress in Overdrive, the system dumps: roll a number of d20s equal to your tier and deal that much physical damage to everything within Very Close range, then drop out and mark a Hit Point. Choose what it hits only if you have Hope to spend: 1 Hope per creature spared.<br> <strong>The Burden.<\/strong> Someone is hunting the model. The hardware is Militech property, and it phones home when Overdrive ends."}], "weapons": [{"name": "Service Pistol", "kind": "Pistol", "line": "Power", "trait": "Any", "range": "Far", "damage": "d6+1 / +4 / +7 / +10 phy", "byTier": ["d6+1 phy", "d6+4 phy", "d6+7 phy", "d6+10 phy"], "burden": "One-Handed", "loads": "", "feature": "<strong>Ubiquitous:<\/strong> attack with any trait you like. Everyone has fired one, and parts are everywhere.", "tier": "all"}, {"name": "Smartgun", "kind": "Pistol", "line": "Smart", "trait": "Knowledge", "range": "Far", "damage": "d6+1 / +4 / +7 / +10 phy", "byTier": ["d6+1 phy", "d6+4 phy", "d6+7 phy", "d6+10 phy"], "burden": "One-Handed", "loads": "", "feature": "<strong>Smart-Linked:<\/strong> it runs off your interface and optics, so a pure human can&rsquo;t fire it. It needs a sensor read on the target, and cover gi s. Strength +2 while powered.", "tier": 3, "kind": "Power frame"}, {"name": "Medium Frame (Tier 4)", "major": 15, "severe": 40, "score": 7, "feature": "<strong>Powered:<\/strong> &minus;1 Evasion. Advantage on Strength Rolls to lift, breach, hold, or haul, and you carry a person or a heavy load at full speed. The workhorse. 4 component slots. Strength +3 while powered.", "tier": 4, "kind": "Power frame"}, {"name": "Heavy Frame (Tier 1)", "major": 8, "severe": 17, "score": 4, "feature": "<strong>Powered:<\/strong> &minus;2 Evasion, &minus;1 Agility. Advantage on Strength Rolls to lift, breach, hold, or haul, and you breach a reinforced door, wall, or vehicle panel as an action, no roll. 5 component slots. Strength +0 while powered.", "tier": 1, "kind": "Power frame"}, {"name": "Heavy Frame (Tier 2)", "major": 13, "severe": 28, "score": 5, "feature": "<strong>Powered:<\/strong> &minus;2 Evasion, &minus;1 Agility. Advantage on Strength Rolls to lift, breach, hold, or haul, and you breach a reinforced door, wall, or vehicle panel as an action, no roll. 5 component slots. Strength +1 while powered.", "tier": 2, "kind": "Power frame"}, {"name": "Heavy Frame (Tier 3)", "major": 15, "severe": 35, "score": 6, "feature": "<strong>Powered:<\/strong> &minus;2 Evasion, &minus;1 Agility. Advantage on Strength Rolls to lift, breach, hold, or haul, and you breach a reinforced door, wall, or vehicle panel as an action, no roll. 5 component slots. Strength +2 while powered.", "tier": 3, "kind": "Power frame"}, {"name": "Heavy Frame (Tier 4)", "major": 17, "severe": 44, "score": 7, "feature": "<strong>Powered:<\/strong> &minus;2 Evasion, &minus;1 Agility. Advantage on Strength Rolls to lift, breach, hold, or haul, and you breach a reinforced door, wall, or vehicle panel as an action, no roll. 5 component slots. Strength +3 while powered.", "tier": 4, "kind": "Power frame"}], "augments": [{"name": "Basic Neural Interface", "group": "Neural", "text": "HUD, silent comms, deck and load handling, and the broadcast block that keeps NBN out of your head. No slot. Free at character creation.", "tier": 1, "noSlot": true}, {"name": "Kerenzikov", "group": "Neural", "text": "You can't be surprised. When an attack targets you, mark a Stress to gain +2 Evasion against it.", "tier": 1, "noSlot": false}, {"name": "Sandevistan", "group": "Neural", "text": "Once per short rest, mark a Stress: after your action resolves, take one more action before the spotlight passes. If you rolled with Fear, the GM still makes their move after it.", "tier": 1, "noSlot": false}, {"name": "Sandevistan Mk.II (military)", "group": "Neural", "text": "As Sandevistan, but once per scene, and the first use each long rest costs no Stress. Other runners will clock it.", "tier": 3, "noSlot": false}, {"name": "Pain Editor", "group": "Neural", "text": "Gain an additional Stress slot. You don't become Vulnerable when your last Stress is marked.", "tier": 1, "noSlot": false}, {"name": "Memory Augment", "group": "Neural", "text": "Perfect recall of the last 30 days, with playback. Once per session, ask the GM one factual question about something you witnessed. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Neural Buffer", "group": "Neural", "text": "When a deck, a Demon, or feedback would make you mark Hit Points, you can mark Stress instead, up to your tier per scene. The hacker's insurance.", "tier": 1, "noSlot": false}, {"name": "Skillplug Jack", "group": "Neural", "text": "Slot one skillplug: a bought Experience at +2 you don't own (<em>Corporate Protocol<\/em>, <em>Combat Medic<\/em>, <em>Pilot<\/em>, a language). Swap during a rest. If your Fear Die shows a 1 on a roll using the plug, it locks for the scene. A plug is a fistful to a stack; Tier 3 plugs are +3.", "tier": 1, "noSlot": false}, {"name": "Vox Harmonizer", "group": "Neural", "text": "Subsonic modulation in the larynx. +1 to Presence Rolls to charm, persuade, or deceive anyone without ear protection, cyberears, or a broadcast block. They never know why they liked you. <strong>Command:<\/strong> once per scene, mark a Stress to speak one word to an unprotected target within Close: Presence Reaction Roll (14) or they obey it for a moment. Nothing that harms them.", "tier": 1, "noSlot": false}, {"name": "Black Box Recorder", "group": "Neural", "text": "Continuous 72-hour sensory record to sealed storage. Can't be wiped remotely; needs physical extraction. A liability if you're caught. A weapon if you're not. <em>No slot.<\/em>", "tier": 3, "noSlot": true}, {"name": "Trauma Suppression", "group": "Neural", "text": "Wealthy non-runner kit: the wearer doesn't form memory of violence done to them. −2 to any roll to recall it. You'll see it on targets. <em>No slot.<\/em>", "tier": 2, "noSlot": true}, {"name": "Defensive Auto System", "group": "Neural", "text": "Wealthy non-runner kit. When threatened, the system drives the body: +2 Evasion, it moves to cover and calls extraction, and the wearer can't attack. A hacker can take control of it (the <em>Puppet<\/em> load, Section C).", "tier": 2, "noSlot": false}, {"name": "Kiroshi Optical Mk.1", "group": "Optical & Sensory", "text": "Full HUD, low-light vision. Standard issue alongside the interface: free at character creation, and it fills no slot.", "tier": 1, "noSlot": true}, {"name": "Kiroshi Optical Mk.3", "group": "Optical & Sensory", "text": "Full HUD, low-light vision, thermal and zoom: smoke and darkness don&rsquo;t obscure for you, and Very Far counts as Far for your attacks. +1 to Instinct Rolls to perceive.", "tier": 1, "noSlot": false}, {"name": "Kiroshi Corporate", "group": "Optical & Sensory", "text": "As Mk.3, indistinguishable from organic eyes, facial recognition always on. The SkyPark crowd standard.", "tier": 2, "noSlot": false}, {"name": "Facial Recognition Suite", "group": "Optical & Sensory", "text": "Identify anyone in a database you can reach, on sight. You're in the databases too. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Flash Suppression", "group": "Optical & Sensory", "text": "Immune to Blinded from light. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Cyberears", "group": "Optical & Sensory", "text": "Immune to sonic weapons and deafening. +1 to Instinct Rolls to hear. <strong>Tracer:<\/strong> name a target within Close; until they're Very Far away or behind a wall, you hear everything they say and where they are. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Retinal Mimic", "group": "Optical & Sensory", "text": "Meet someone's eyes within Very Close for a moment: you can reproduce their retinal pattern for a scanner. Holds a dozen. <em>No slot.<\/em>", "tier": 3, "noSlot": true}, {"name": "Trajectory Overlay", "group": "Optical & Sensory", "text": "Once per short rest, after a missed ranged attack, mark a Stress to hit instead.", "tier": 3, "noSlot": false}, {"name": "Gorilla Arms", "group": "Musculoskeletal & Limb", "text": "The weapon above, plus +1 Strength (maximum +3) and advantage on Strength Rolls to lift, breach, hold, or haul. Obvious. Runners wear them like a statement.", "tier": "all", "noSlot": false}, {"name": "Mantis Blade(s)", "group": "Musculoskeletal & Limb", "text": "The weapon above. Retracts flush; outlines still show under the skin.", "tier": "all", "noSlot": false}, {"name": "Monowire Spool", "group": "Musculoskeletal & Limb", "text": "The weapon above.", "tier": "all", "noSlot": false}, {"name": "Subdermal Armor (Light)", "group": "Musculoskeletal & Limb", "text": "+1 Armor Score. Slightly unnatural skin texture on close inspection.", "tier": 1, "noSlot": false}, {"name": "Subdermal Armor (Heavy)", "group": "Musculoskeletal & Limb", "text": "+2 Armor Score and +2 to both thresholds; −1 Evasion. Scanners flag it.", "tier": 3, "noSlot": false}, {"name": "Reflex Wiring", "group": "Musculoskeletal & Limb", "text": "+1 Evasion. The thing that makes runners move like they do.", "tier": 1, "noSlot": false}, {"name": "Coordination Augment", "group": "Musculoskeletal & Limb", "text": "+1 Agility (maximum +3) and +1 Evasion.", "tier": 3, "noSlot": false}, {"name": "Titanium Bone Lace", "group": "Musculoskeletal & Limb", "text": "Gain an additional Hit Point slot. +1 to your Severe threshold.", "tier": 1, "noSlot": false}, {"name": "Gecko Pads", "group": "Musculoskeletal & Limb", "text": "Climb any surface at normal speed with one free hand. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Hydraulic Legs", "group": "Musculoskeletal & Limb", "text": "Move to Far as part of any action; ignore falls from Far.", "tier": 3, "noSlot": false}, {"name": "Cyberlimb / Synthlimb", "group": "Musculoskeletal & Limb", "text": "A replacement limb with a sealed compartment for one small item. Synthlimb looks natural. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Neolimb", "group": "Musculoskeletal & Limb", "text": "An extra arm, tail, or tendril under full control. You can hold a secondary weapon while wielding a two-handed primary.", "tier": 3, "noSlot": false}, {"name": "Arc Palms", "group": "Musculoskeletal & Limb", "text": "The weapon above.", "tier": "all", "noSlot": false}, {"name": "Limbgun", "group": "Musculoskeletal & Limb", "text": "The weapon above.", "tier": "all", "noSlot": false}, {"name": "Iron Hand Aegis", "group": "Musculoskeletal & Limb", "text": "Once per short rest, when a ranged attack hits you, mark a Stress to make it miss.", "tier": 3, "noSlot": false}, {"name": "Titan Gun System", "group": "Musculoskeletal & Limb", "text": "Ignore the Evasion penalty of any weapon that imposes one. Requires Strength +2 or better.", "tier": 3, "noSlot": false}, {"name": "Blood Filter", "group": "Dermal & Body", "text": "Immune to alcohol, street drugs, and poisons you don't choose to take. Advantage on reaction rolls against gas and toxins. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Adrenal Pump", "group": "Dermal & Body", "text": "Once per scene, when you mark Hit Points, gain a Hope.", "tier": 1, "noSlot": false}, {"name": "Stim Injector (auto)", "group": "Dermal & Body", "text": "Once per short rest, when you mark 2 or more Hit Points from one hit, clear 1. When you Tend to Wounds on a short rest, clear one extra Hit Point.", "tier": 1, "noSlot": false}, {"name": "Thermal Regulator", "group": "Dermal & Body", "text": "Forty below is just weather. Advantage against cold and heat effects. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Holdout Cavity", "group": "Dermal & Body", "text": "A sealed internal pocket: two small items no search short of a scanner finds. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Deadman Circuit", "group": "Dermal & Body", "text": "Remove your augments without your codes and they fry. Optionally alerts you. Standard for anyone with real chrome in the Shade. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Lung Seal", "group": "Dermal & Body", "text": "Sealed against gas, smoke, and contact toxins whenever you choose. <em>No slot.<\/em>", "tier": 2, "noSlot": true}, {"name": "Aesthetic Augmentation Suite", "group": "Dermal & Body", "text": "+1 Presence (maximum +3). Reads as naturally striking.", "tier": 2, "noSlot": false}, {"name": "Nanotube Mesh Skin", "group": "Dermal & Body", "text": "+1 Armor Score. Burning and bleeding effects can't affect you.", "tier": 3, "noSlot": false}, {"name": "Toxin Synthesizer", "group": "Dermal & Body", "text": "Produce one dose of any Common drug or poison per day. Uncommon and Rare compounds need a Knowledge Roll (15).", "tier": 3, "noSlot": false}, {"name": "Viper Sting", "group": "Dermal & Body", "text": "A hidden injector. On a successful unarmed hit or grapple, deliver a loaded dose. Holds four.", "tier": 3, "noSlot": false}, {"name": "Banshee Module", "group": "Dermal & Body", "text": "Reproduce any voice you've heard. Once per rest, a sonic burst: everyone within Very Close marks a Stress and must succeed on an Instinct Reaction Roll (13) or become temporarily Vulnerable. Glass shatters.", "tier": 3, "noSlot": false}, {"name": "Skull Citadel", "group": "Dermal & Body", "text": "When you choose Avoid Death, you don't roll for a scar.", "tier": 3, "noSlot": false}, {"name": "Zombie Wires", "group": "Dermal & Body", "text": "When you would make a death move, first take one action with advantage. Then choose.", "tier": 3, "noSlot": false}, {"name": "Remote Control Unit", "group": "Interface & Control", "text": "Command drones and rigged vehicles by thought, hands free. +1 to rolls you make through a drone.", "tier": 1, "noSlot": false}, {"name": "Integrated Deck", "group": "Interface & Control", "text": "Any deck (Decks, above), implanted rather than carried. Frees a hand; can't be lost or taken. The deck's tier. <em>No slot.<\/em>", "tier": 1, "noSlot": true}, {"name": "Firewall (mod)", "group": "Interface & Control", "text": "Applied to your interface or one augment: quickhacks against it are 2 harder to land. Standard kit for anyone who knows what they're doing.", "tier": 1, "noSlot": false}, {"name": "Passive Scanner (mod)", "group": "Interface & Control", "text": "You notice any quickhack run within Close range, and who ran it if they failed with Fear. You notice active augment use the same way.", "tier": 1, "noSlot": false}, {"name": "EMP Hardening (mod)", "group": "Interface & Control", "text": "Applied to one augment: it ignores EMP and Neurotox effects.", "tier": 3, "noSlot": false}, {"name": "Profile Adjustment (mod)", "group": "Interface & Control", "text": "Applied to one augment: it reads one tier lower, or as organic, to scanners.", "tier": 2, "noSlot": false}, {"name": "Quick Detach (mod)", "group": "Interface & Control", "text": "Applied to a limb or eye: swap it in five minutes, no ripper.", "tier": 1, "noSlot": false}, {"name": "Linear Frame", "group": "Borgware", "text": "An internal chassis: your skeleton and the muscle over it are machine. +1 to Strength (maximum +3) and +3 to both damage thresholds. You count as being in a power frame for anything that asks.", "tier": 4, "noSlot": false}, {"name": "Shoulder Mount", "group": "Borgware", "text": "Two folding arms above your own. Your burden is four hands instead of two, and you can swap any weapon you carry without marking a Stress.", "tier": 4, "noSlot": false}, {"name": "Optic Cluster", "group": "Borgware", "text": "A ring of eyes around the skull. Nothing within Far is Hidden from you, and you always know what is behind you.", "tier": 4, "noSlot": false}, {"name": "Sensor Crown", "group": "Borgware", "text": "Radar and signal intake built into the head. You detect every powered device, drone and augmented body within Far, through walls.", "tier": 4, "noSlot": false}, {"name": "Redundant Systems", "group": "Borgware", "text": "Two of everything that matters. Your augments can&rsquo;t be made <em>Offline<\/em>, and EMP and Neurotox do nothing to you.", "tier": 4, "noSlot": false}, {"name": "Full-Body Conversion", "group": "Borgware", "text": "Total chassis. Tier 4. Not for sale; a character who has one takes the Conversion in Section 0.", "tier": 4, "noSlot": false}], "kit": [{"name": "Road Radio", "group": "Signal War · Jammers & Dead Zones", "text": "Clan-protocol comms. Corporate jamming and intercept don't work on it. The crew can share one net if every member carries a unit or a Comms Array.", "tier": 1}, {"name": "Chaff Cloak", "group": "Signal War · Jammers & Dead Zones", "text": "Worn. Passive scanners, aug detectors, and drone sensors have disadvantage to find you. Doesn't fool eyes.", "tier": 2}, {"name": "Blank Tag", "group": "Spoofers · Reading As Someone Else", "text": "Worn. Aug scanners and biometric gates read nothing at all. In the Shade, nothing is normal. On the SkyPark, nothing is a red flag.", "tier": 1}, {"name": "Citizen Skin", "group": "Spoofers · Reading As Someone Else", "text": "Worn. You read to scanners as a corporate citizen of a corp you name, mid-grade clearance: badge handshake, biometric echo, credit halo. Passes automated gates and a bored guard. A live check against the corp's roster is a Presence Roll (16) to hold the story, and the Skin burns if you fail with Fear.", "tier": 2}, {"name": "Executive Skin", "group": "Spoofers · Reading As Someone Else", "text": "As Citizen Skin, reading as senior. Automated systems defer; human staff assume you belong; the live check is Difficulty 18. Burns the same way, and someone important notices the burn.", "tier": 3}, {"name": "Harness Rig", "group": "The Road · Survival & Fabrication", "text": "Worn. +1 Strength (maximum +3) from load-bearing assist; carry a wounded ally at full speed.", "tier": 1}, {"name": "Clan Visor", "group": "The Road · Survival & Fabrication", "text": "Worn. As the frame component, standalone.", "tier": 1}, {"name": "Clan Optics", "group": "The Road · Survival & Fabrication", "text": "Worn. Thermal and zoom: smoke and dark don't obscure; Very Far counts as Far for your attacks. +1 to Instinct Rolls to perceive.", "tier": 1}, {"name": "Reflex Harness", "group": "The Road · Survival & Fabrication", "text": "Worn. Mechanical assist across the joints: +1 Evasion. The pure human's answer to Reflex Wiring.", "tier": 1}, {"name": "Ballast Vest", "group": "The Road · Survival & Fabrication", "text": "Worn under armor. Gain an additional Hit Point slot. +1 to your Severe threshold.", "tier": 1}, {"name": "Clan Pump", "group": "The Road · Survival & Fabrication", "text": "Worn. Once per scene, when you mark Hit Points, gain a Hope. The pure human's Adrenal Pump.", "tier": 1}, {"name": "Kick Rig", "group": "The Road · Survival & Fabrication", "text": "Worn. As Sandevistan: once per short rest, mark a Stress to act once more after your action resolves. Mechanical, loud, and it works.", "tier": 1}, {"name": "Stim Belt", "group": "The Road · Survival & Fabrication", "text": "Worn. Once per short rest, when you mark 2 or more Hit Points from one hit, clear 1. When you Tend to Wounds on a short rest, clear one extra Hit Point.", "tier": 1}, {"name": "Blade Harness", "group": "The Road · Survival & Fabrication", "text": "Worn. A retracting forearm blade: Finesse, Melee, d8+1 / +4 / +7 / +10 physical by the tier it was built at, one-handed, can't be disarmed or found by a pat-down. <strong>Pounce:<\/strong> once per scene, move to a target within Far as part of the attack. Rebuilding it a tier up is a build of that tier.", "tier": "all"}, {"name": "Ward", "group": "The Road · Survival & Fabrication", "text": "Worn. The clan-fab external broadcast block, with a scanner: you notice any quickhack run within Close.", "tier": 1}], "loads": [{"name": "Distract", "cost": "Spend a Hope", "text": "False input pulls their attention. Until they next act, rolls against them have advantage, and you can move within Close range without being noticed.", "tier": 1}, {"name": "Glitch", "cost": "Spend a Hope", "text": "One named augment or device goes <em>Offline<\/em>.", "tier": 1}, {"name": "Jam", "cost": "Spend a Hope", "text": "A smart weapon won't fire. Clearing it takes their action.", "tier": 1}, {"name": "Loop", "cost": "Free", "text": "A camera replays its last thirty seconds until someone patches it.", "tier": 1}, {"name": "Open", "cost": "Free", "text": "A locked door, gate, or panel opens.", "tier": 1}, {"name": "Blind", "cost": "Spend a Hope", "text": "Their optics reboot: temporarily <em>Blinded<\/em>.", "tier": 2}, {"name": "Hijack", "cost": "Mark a Stress", "text": "One drone is yours for the scene. Commanding it follows the drone rule in Section B: anything it rolls for is your action. Each time you're spotlighted with it, the GM can spend a Fear to make you hit it again or lose it.", "tier": 2}, {"name": "Scramble", "cost": "Mark a Stress", "text": "Their next attack goes at the nearest creature. Illegal; counts as assault.", "tier": 2}, {"name": "Freeze", "cost": "Once per rest", "text": "Temporarily <em>Restrained<\/em> and they can't act. They can still see and hear. Terrifying from the inside.", "tier": 3}, {"name": "Crash", "cost": "Spend a Hope", "text": "A hacker's deck goes <em>Offline<\/em>; rebooting takes their action.", "tier": 3}, {"name": "Fry", "cost": "Mark 2 Stress", "text": "They mark an extra Hit Point. The one people go to prison for.", "tier": 3}, {"name": "Puppet", "cost": "Once per rest", "text": "Presence Reaction Roll (18) or you drive their body for a moment: one move and one action, GM adjudicates. Works on anyone whose arms or legs are chrome, or who has a Defensive Auto System. They're aware the whole time.", "tier": 4}, {"name": "Fleet", "cost": "Once per long rest", "text": "Every drone on the network reads the crew as authorized. They stop treating you as a threat; they don't take your orders (that's Hijack). Start a countdown (4) that ticks on every roll with Fear. The big-job move.", "tier": 4}, {"name": "Detonate", "cost": "Mark a Stress", "text": "Trigger any smart-detonator grenade on their person or in range.", "tier": 4}]};

/* ---------- helpers ---------- */
function e(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sgn(n){ n = Number(n)||0; return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }
function trad(){ var c = C(); return D.traditions.filter(function(t){ return t.name === c.tradition; })[0] || null; }
function tradByName(n){ return D.traditions.filter(function(t){ return t.name === n; })[0] || null; }
function tier(){ var l = C().level; return l < 2 ? 1 : l < 5 ? 2 : l < 8 ? 3 : 4; }
function prof(){ var l = C().level; return 1 + (l>=2) + (l>=5) + (l>=8) + (Number(C().profAdj)||0); }
function hopeMax(){ return Math.max(0, 6 - (Number(C().scars)||0)); }
function hpMax(){ var t = trad(); return (t ? t.hp : 0) + (Number(C().hpExtra)||0); }
function stressMax(){ return 6 + (Number(C().stressExtra)||0); }
function armorInfo(){
  var a = C().armor, l = C().level;
  if(!a) return { name:'Unarmored', major:l, severe:2*l, score:Math.max(0,(Number(C().armorAdj)||0)), feature:'' };
  return { name:a.name, major:(Number(a.major)||0)+l, severe:(Number(a.severe)||0)+l, score:Math.max(0,(Number(a.score)||0)+(Number(C().armorAdj)||0)), feature:a.feature||'' };
}
function slotsMax(){ var l = C().level; return (l<2?2:l<5?3:l<8?4:5) + (Number(C().slotsExtra)||0); }
function clampMarks(){
  var c = C();
  c.hpMarked = Math.min(Math.max(0,c.hpMarked), hpMax());
  c.stressMarked = Math.min(Math.max(0,c.stressMarked), stressMax());
  c.hope = Math.min(Math.max(0,c.hope), hopeMax());
  c.armorMarked = Math.min(Math.max(0,c.armorMarked), armorInfo().score);
}
function eligibleDomains(){
  var t = trad(), c = C(), out = [];
  if(t) t.domains.forEach(function(d){ out.push({ name:d, max:c.level }); });
  if(c.multiclass && out.every(function(o){ return o.name !== c.multiclass; })) out.push({ name:c.multiclass, max:Math.ceil(c.level/2), multi:true });
  return out;
}
function findCard(dom, name){ var d = D.domains[dom]; return d ? d.cards.filter(function(x){ return x.name === name; })[0] : null; }
function weaponData(name){ return D.weapons.filter(function(w){ return w.name === name; }); }

/* ---------- rendering ---------- */
function opt(v, label, cur){ return '<option value="'+e(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+e(label)+'</option>'; }
function field(label, key, val, ph){ var id='f-'+key; return '<label class="f" for="'+id+'">'+e(label)+'</label><input type="text" id="'+id+'" data-k="'+key+'" value="'+e(val)+'"'+(ph?' placeholder="'+e(ph)+'"':'')+'>'; }
function numField(label, key, val, hint){ var id='f-'+key; return '<div><label class="f" for="'+id+'">'+e(label)+'</label><input type="number" inputmode="numeric" id="'+id+'" data-k="'+key+'" data-num="1" value="'+e(val)+'">'+(hint?'<div class="small muted">'+e(hint)+'</div>':'')+'</div>'; }

function tracker(key, label, count, max, extraNote){
  var boxes = '';
  for(var i=0;i<max;i++){
    var on = i < count;
    boxes += '<button type="button" class="box" data-a="mark" data-t="'+key+'" data-i="'+i+'" aria-pressed="'+on+'" aria-label="'+e(label)+' '+(i+1)+' of '+max+(on?(key==='hope'?', held':', marked'):(key==='hope'?', empty':', clear'))+'">'+(on?(key==='hope'?'●':'✕'):(i+1))+'</button>';
  }
  if(key === 'hope'){ for(var j=max;j<6;j++) boxes += '<span class="box lost" role="img" aria-label="Hope slot lost to a scar" style="display:inline-flex;align-items:center;justify-content:center">—</span>'; }
  var word = key === 'hope' ? count+' of '+max+' Hope' : count+' of '+max+' marked';
  return '<div class="tracker"><div class="top"><span class="name">'+e(label)+'</span><span class="count" aria-live="polite">'+word+'</span>'+
    '<span class="pm"><button type="button" data-a="step" data-t="'+key+'" data-d="-1" aria-label="'+e(label)+' minus one">−</button><button type="button" data-a="step" data-t="'+key+'" data-d="1" aria-label="'+e(label)+' plus one">+</button></span></div>'+
    '<div class="boxes">'+boxes+'</div>'+(extraNote?'<div class="small muted">'+extraNote+'</div>':'')+'</div>';
}

function sWho(){
  var c = C(), t = trad();
  var h = '<section id="s-who"><h2>Who</h2>';
  h += '<div class="row"><div>'+field('Name','name',c.name)+'</div><div>'+field('Pronouns','pronouns',c.pronouns)+'</div></div>';
  h += field('Concept, in one sentence','concept',c.concept,'A clan botanist trying to solve the medicine problem');
  h += '<div class="row"><div><label class="f" for="f-level">Level</label><select id="f-level" data-k="level" data-num="1" data-re="1">';
  for(var l=1;l<=10;l++) h += opt(l, 'Level '+l, c.level);
  h += '</select><div class="small muted">Tier '+tier()+' · Proficiency '+prof()+'</div></div>';
  h += '<div><label class="f" for="f-trad">Tradition</label><select id="f-trad" data-k="tradition" data-re="1">'+opt('','Choose a Tradition',c.tradition);
  D.traditions.forEach(function(x){ h += opt(x.name, x.name+' ('+x.domains.join(' · ')+')', c.tradition); });
  h += '</select></div></div>';
  if(t){
    h += '<p class="muted"><em>'+e(t.opener)+'</em></p>';
    h += '<label class="f" for="f-path">Path</label><select id="f-path" data-k="path" data-re="1">'+opt('','Choose a Path',c.path);
    t.paths.forEach(function(p){ h += opt(p.name, p.name+': '+p.tag, c.path); });
    h += '</select>';
  }
  h += '<div class="row"><div><label class="f" for="f-up">Where you grew up</label><select id="f-up" data-k="upbringing" data-re="1">'+opt('','Choose one',c.upbringing);
  D.upbringings.forEach(function(x){ h += opt(x.name, x.name, c.upbringing); });
  h += '</select></div><div><label class="f" for="f-fl">What you were</label><select id="f-fl" data-k="formerLife" data-re="1">'+opt('','Choose one',c.formerLife);
  D.formerLives.forEach(function(x){ h += opt(x.name, x.name, c.formerLife); });
  h += '</select></div></div>';
  h += '<label class="f" for="f-fl2">A second former life (optional)</label><select id="f-fl2" data-k="formerLife2" data-re="1">'+opt('','None',c.formerLife2);
  D.formerLives.forEach(function(x){ if(x.name !== c.formerLife) h += opt(x.name, x.name, c.formerLife2); });
  h += '</select>';
  if(c.formerLife2) h += '<p class="small muted">Two lives: take one feature from each, chosen with the GM, never both from the same one.</p>';
  h += '<div class="f" style="font-weight:800;margin-top:.8rem">Augmented or Pure Human</div><div class="radio-row" role="radiogroup" aria-label="Augmented or Pure Human">'+
    '<label><input type="radio" name="aug" data-k="augmented" data-bool="1" value="1"'+(c.augmented?' checked':'')+' data-re="1"> Augmented</label>'+
    '<label><input type="radio" name="aug" data-k="augmented" data-bool="1" value="0"'+(!c.augmented?' checked':'')+' data-re="1"> Pure Human</label></div>';
  h += '<label class="f" for="f-conv">Conversion (optional; only if the GM offers one)</label><select id="f-conv" data-k="conversion" data-re="1">'+opt('','None',c.conversion);
  D.conversions.forEach(function(x){ h += opt(x.name, x.name, c.conversion); });
  h += '</select>';
  h += field('What you look like','looks',c.looks);
  return h + '</section>';
}

function sNow(){
  var c = C(), t = trad(), a = armorInfo();
  clampMarks();
  var h = '<section id="s-now"><h2>Right Now</h2>';
  h += '<div class="stats">'+
    '<div class="stat"><div class="k">Evasion</div><div class="v">'+((t?t.evasion:0)+(Number(c.evasionAdj)||0))+'</div><div class="d">'+(t?'Tradition '+t.evasion+(c.evasionAdj?', '+sgn(c.evasionAdj)+' other':''):'Choose a Tradition')+'</div></div>'+
    '<div class="stat"><div class="k">Major</div><div class="v">'+a.major+'</div><div class="d">at or above: mark 2 HP</div></div>'+
    '<div class="stat"><div class="k">Severe</div><div class="v">'+a.severe+'</div><div class="d">at or above: mark 3 HP</div></div>'+
    '<div class="stat"><div class="k">Proficiency</div><div class="v">'+prof()+'</div><div class="d">damage dice you roll</div></div>'+
    '</div>';
  h += '<p class="small muted">Below Major: mark 1 Hit Point. Double your Severe ('+(2*a.severe)+'): mark 4. Before you mark, you can spend an Armor Slot to drop the hit one step.</p>';
  h += tracker('hp','Hit Points',c.hpMarked,hpMax(), c.hpMarked>=hpMax()&&hpMax()>0 ? '<span class="warn">Last Hit Point marked: choose a death move.</span>' : '');
  h += tracker('stress','Stress',c.stressMarked,stressMax(), c.stressMarked>=stressMax() ? '<span class="warn">All Stress marked: you are Vulnerable. More Stress marks a Hit Point instead.</span>' : '');
  h += tracker('hope','Hope',c.hope,hopeMax(), 'Spend 1 to add an Experience or Help an Ally, 3 for your Hope Feature.'+(c.scars?' Scars: '+c.scars+'.':''));
  h += tracker('armor','Armor Slots ('+a.name+')',c.armorMarked,a.score, a.score? 'They come back when you repair armor during a rest.' : 'No armor. Pick some under Weapons &amp; armor.');
  h += '<div class="row">'+numField('Extra Hit Point slots','hpExtra',c.hpExtra,'advancements, Origin, cards')+numField('Extra Stress slots','stressExtra',c.stressExtra,'advancements, Origin, cards')+'</div>';
  h += '<div class="row">'+numField('Evasion from other sources','evasionAdj',c.evasionAdj,'augments, armor, cards, advancements')+numField('Scars (Hope slots lost)','scars',c.scars,'')+'</div>';
  h += '<div class="acts" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:.8rem"><button type="button" data-a="rest" data-r="short">Short rest help</button><button type="button" data-a="rest" data-r="long">Long rest help</button></div>';
  return h + '</section>';
}

function sTraits(){
  var c = C(), t = trad();
  var h = '<section id="s-traits"><h2>Traits</h2><p class="lede">Start with +2, +1, +1, 0, 0, −1 in any order. Add the trait to every roll that uses it.</p>';
  TRAITS.forEach(function(k){
    h += '<div class="trait"><span class="nm">'+k+'</span><span class="val">'+
      '<button type="button" data-a="trait" data-t="'+k+'" data-d="-1" aria-label="'+k+' down">−</button>'+
      '<span class="num" aria-live="polite" aria-label="'+k+' '+sgn(c.traits[k])+'">'+sgn(c.traits[k])+'</span>'+
      '<button type="button" data-a="trait" data-t="'+k+'" data-d="1" aria-label="'+k+' up">+</button></span>'+
      '<span class="what">'+e(D.traits[k]||'')+'</span></div>';
  });
  var vals = TRAITS.map(function(k){ return Number(c.traits[k])||0; }).sort().join(',');
  if(c.level === 1) h += vals === '-1,0,0,1,1,2' ? '<p class="good">Matches the starting array.</p>' : '<p class="warn">At level 1 the traits should be +2, +1, +1, 0, 0, −1.</p>';
  if(t) h += '<button type="button" data-a="suggest">Use the '+e(t.name)+'\'s suggested traits</button>';
  return h + '</section>';
}

function weaponBlock(slot){
  var c = C(), w = c[slot], label = slot === 'primary' ? 'Primary weapon' : 'Secondary weapon';
  var h = '<h3>'+label+'</h3><label class="f" for="f-'+slot+'-pick">Pick from the book</label><select id="f-'+slot+'-pick" data-a2="pickWeapon" data-slot="'+slot+'">'+opt('','Choose a weapon','');
  var groups = {};
  D.weapons.forEach(function(x, i){
    var ok = slot === 'secondary' ? x.kind === 'Secondary' : x.kind !== 'Secondary';
    if(ok){ (groups[x.kind] = groups[x.kind] || []).push('<option value="'+i+'">'+e(x.name)+' · '+e(x.trait)+', '+e(x.range)+(x.tier==='all'?'':' · Tier '+x.tier)+'</option>'); }
  });
  Object.keys(groups).forEach(function(g){ h += '<optgroup label="'+e(g)+'">'+groups[g].join('')+'</optgroup>'; });
  h += '</select>';
  if(!w) return h + '<p class="muted">None yet.</p>';
  var tr = w.trait, trv = TRAITS.indexOf(tr) >= 0 ? sgn(c.traits[tr]) : null;
  h += '<div class="card"><div class="hd"><span class="nm">'+e(w.name)+'</span><span class="meta">'+e([w.trait, w.range, w.burden].filter(Boolean).join(' · '))+'</span></div>';
  h += '<div class="tx"><strong>Attack:</strong> 2d12 '+(trv!==null? '+ '+e(tr)+' ('+trv+')' : (tr==='Any'?'+ any trait you choose':'+ '+e(tr)))+'.<br><strong>Damage:</strong> '+e(w.damage)+', roll '+prof()+' '+(prof()===1?'die':'dice')+' (Proficiency).'+(w.loads?'<br><strong>Loads:</strong> '+e(w.loads):'')+'</div>';
  if(w.feature) h += '<div class="tx">'+w.feature+'</div>';
  h += '<div class="row"><div><label class="f" for="f-'+slot+'-dmg">Damage (edit if yours differs)</label><input type="text" id="f-'+slot+'-dmg" data-k="'+slot+'.damage" value="'+e(w.damage)+'"></div>';
  if(w.byTier) { h += '<div><label class="f" for="f-'+slot+'-tier">Weapon tier</label><select id="f-'+slot+'-tier" data-a2="weaponTier" data-slot="'+slot+'">'; for(var i=1;i<=w.byTier.length;i++) h += opt(i,'Tier '+i+': '+w.byTier[i-1], w.tier||1); h += '</select></div>'; }
  h += '</div><div class="acts"><button type="button" class="primary" data-a="rollDmg" data-slot="'+slot+'">Roll damage</button><button type="button" data-a="rollDmg" data-slot="'+slot+'" data-crit="1">Roll critical damage</button><button type="button" data-a="attack" data-slot="'+slot+'">Roll attack</button><button type="button" class="danger" data-a="clearWeapon" data-slot="'+slot+'">Remove</button></div></div>';
  return h;
}

function sArms(){
  var c = C(), a = armorInfo();
  var h = '<section id="s-arms"><h2>Weapons &amp; Armor</h2>';
  h += weaponBlock('primary') + weaponBlock('secondary');
  h += '<h3>Armor</h3><label class="f" for="f-armor-pick">Pick from the book</label><select id="f-armor-pick" data-a2="pickArmor">'+opt('','Choose armor','');
  var groups = {};
  D.armor.forEach(function(x, i){ (groups[x.kind] = groups[x.kind] || []).push('<option value="'+i+'">'+e(x.name)+' · '+x.major+' / '+x.severe+' · Score '+x.score+'</option>'); });
  Object.keys(groups).forEach(function(g){ h += '<optgroup label="'+e(g)+'">'+groups[g].join('')+'</optgroup>'; });
  h += '</select>';
  if(c.armor){
    h += '<div class="card"><div class="hd"><span class="nm">'+e(c.armor.name)+'</span><span class="meta">Base '+e(c.armor.major)+' / '+e(c.armor.severe)+' · Score '+e(c.armor.score)+'</span></div>'+(c.armor.feature?'<div class="tx">'+c.armor.feature+'</div>':'')+
      '<div class="tx">With your level added: Major <strong>'+a.major+'</strong>, Severe <strong>'+a.severe+'</strong>, <strong>'+a.score+'</strong> Armor Slots.</div>'+
      '<div class="acts"><button type="button" class="danger" data-a="clearArmor">Remove</button></div></div>';
  } else h += '<p class="muted">Unarmored: Major is your level, Severe twice your level, no Armor Slots.</p>';
  h += '<div class="row">'+numField('Armor Score from other sources','armorAdj',c.armorAdj,'at most +2 from everything else combined')+'</div>';
  return h + '</section>';
}

function cardHtml(ref, idx){
  var d = findCard(ref.domain, ref.name);
  if(!d) return '<div class="card"><span class="nm">'+e(ref.name)+'</span> <span class="warn">(not in the current book)</span><div class="acts"><button type="button" class="danger" data-a="rmCard" data-i="'+idx+'">Remove</button></div></div>';
  return '<div class="card'+(ref.active?'':' inactive')+'"><div class="hd"><span class="nm">'+e(d.name)+'</span><span class="meta">'+e(ref.domain)+' · Level '+d.level+' · Recall '+d.recall+'</span></div><div class="tx">'+d.text+'</div>'+
    '<div class="acts"><button type="button" data-a="toggleCard" data-i="'+idx+'">'+(ref.active?'Move to vault':'Move to loadout')+'</button><button type="button" class="danger" data-a="rmCard" data-i="'+idx+'">Remove</button></div></div>';
}

function sCards(){
  var c = C(), t = trad();
  var act = [], vault = [];
  c.cards.forEach(function(r, i){ (r.active ? act : vault).push(cardHtml(r, i)); });
  var h = '<section id="s-cards"><h2>Cards</h2>';
  if(!t) return h + '<p class="muted">Choose a Tradition first; its two domains are where your cards come from.</p></section>';
  var want = c.level + 1;
  h += '<p class="lede">Domains: <strong>'+e(t.domains.join(' and '))+'</strong>. Two level-1 cards to start, then one each level. Five can be active at once; the rest wait in your vault.</p>';
  h += '<p><strong>'+c.cards.length+'</strong> cards held'+(c.cards.length < want ? ' · the usual count at level '+c.level+' is '+want+' (more with the Domain Card advancement)' : '')+'.</p>';
  h += '<button type="button" class="primary" data-a="openCards">Add a card</button>';
  h += '<h3>Loadout ('+act.length+' of 5)</h3>'+(act.join('')||'<p class="muted">Empty.</p>');
  h += '<h3>Vault ('+vault.length+')</h3>'+(vault.join('')||'<p class="muted">Empty.</p>');
  if(c.level >= 5){
    h += '<label class="f" for="f-multi">Multiclass domain (level 5 and up)</label><select id="f-multi" data-k="multiclass" data-re="1">'+opt('','None',c.multiclass);
    Object.keys(D.domains).forEach(function(d){ if(t.domains.indexOf(d) < 0) h += opt(d, d+' (cards up to level '+Math.ceil(c.level/2)+')', c.multiclass); });
    h += '</select>';
  }
  return h + '</section>';
}

function feat(title, sub, body){ return '<div class="panel feature"><h3 style="margin-top:0">'+e(title)+(sub?' <span class="tag">'+e(sub)+'</span>':'')+'</h3><div>'+body+'</div></div>'; }
function sFeat(){
  var c = C(), t = trad(), h = '<section id="s-feat"><h2>Features</h2>';
  if(t){
    h += feat('Class Feature · '+t.classFeature.name, t.name, t.classFeature.text);
    h += feat('Hope Feature · '+t.hopeFeature.name, 'Spend 3 Hope', t.hopeFeature.text + '<div class="acts" style="display:flex;margin-top:.5rem"><button type="button" class="primary" data-a="hopeFeature">Spend 3 Hope</button></div>');
    var p = t.paths.filter(function(x){ return x.name === c.path; })[0];
    if(p){
      p.features.forEach(function(f){
        var have = f.rank === 'Foundation' || (f.rank === 'Specialization' && c.pathSpec) || (f.rank === 'Mastery' && c.pathMastery);
        var key = f.rank === 'Specialization' ? 'pathSpec' : f.rank === 'Mastery' ? 'pathMastery' : '';
        var box = key ? '<label class="check"><input type="checkbox" data-k="'+key+'" data-bool="1" data-re="1"'+(c[key]?' checked':'')+'> I have taken this ('+e(f.when)+')</label>' : '';
        h += '<div class="panel feature"'+(have?'':' style="border-style:dashed;opacity:.8"')+'><h3 style="margin-top:0">'+e(p.name)+' · '+e(f.name)+' <span class="tag">'+e(f.rank)+'</span></h3><div>'+f.text+'</div>'+box+'</div>';
      });
    }
    h += feat('Kit', t.name, t.kit);
  } else h += '<p class="muted">Choose a Tradition to see its features.</p>';
  var up = D.upbringings.filter(function(x){ return x.name === c.upbringing; })[0];
  if(up) h += feat('Grew up · '+up.name, 'Origin', up.text + '<div class="small muted" style="margin-top:.3rem">Six words: '+e(up.words)+'</div>');
  [c.formerLife, c.formerLife2].forEach(function(n){ var fl = D.formerLives.filter(function(x){ return x.name === n; })[0]; if(fl) h += feat('Was · '+fl.name, 'Origin', fl.text); });
  var cv = D.conversions.filter(function(x){ return x.name === c.conversion; })[0];
  if(cv) h += feat('Conversion · '+cv.name, 'Conversion', '<p><em>'+e(cv.opener)+'</em></p>'+cv.text);
  return h + '</section>';
}

function sExp(){
  var c = C(), t = trad(), h = '<section id="s-exp"><h2>Experiences</h2><p class="lede">Before a roll, spend a Hope to add a fitting Experience. Two at +2 to start; one more at levels 2, 5 and 8.</p>';
  c.experiences.forEach(function(x, i){
    h += '<div class="card"><div class="row"><div style="flex:3 1 14rem"><label class="f" for="f-exp'+i+'">Experience '+(i+1)+'</label><input type="text" id="f-exp'+i+'" data-k="experiences.'+i+'.name" value="'+e(x.name)+'"></div>'+
      '<div style="flex:1 1 8rem"><label class="f" for="f-expb'+i+'">Bonus</label><input type="number" inputmode="numeric" id="f-expb'+i+'" data-k="experiences.'+i+'.bonus" data-num="1" value="'+e(x.bonus)+'"></div></div>'+
      '<div class="acts"><button type="button" class="danger" data-a="rmExp" data-i="'+i+'">Remove</button></div></div>';
  });
  h += '<button type="button" class="primary" data-a="addExp">Add an Experience</button>';
  if(t) { h += '<p class="small muted" style="margin-top:1rem">Ideas from the '+e(t.name)+' page (tap to add):</p><div class="chips">'; t.experiences.forEach(function(x){ h += '<button type="button" data-a="addExp" data-v="'+e(x)+'">'+e(x)+'</button>'; }); h += '</div>'; }
  return h + '</section>';
}

function sChrome(){
  var c = C(), h = '<section id="s-chrome"><h2>'+(c.augmented?'Chrome':'Kit')+'</h2>';
  var used = c.augments.filter(function(a){ return !a.noSlot; }).length;
  h += '<p class="lede">'+(c.augmented ? 'Augment slots' : 'Kit slots')+': <strong>'+used+' of '+slotsMax()+'</strong> used. '+(c.augmented ? 'Your Basic Neural Interface and Kiroshi Mk.1 optics are free and fill no slot.' : 'You wear a clan-fab broadcast block, free.')+'</p>';
  if(used > slotsMax()) h += '<p class="warn">More than your slots allow.</p>';
  c.augments.forEach(function(a, i){
    var odd = a.src && (a.src === 'aug') !== !!c.augmented;
    h += '<div class="card"><div class="hd"><span class="nm">'+e(a.name)+'</span><span class="meta">'+e(a.group||'')+(a.noSlot?' · No slot':'')+'</span></div>'+(odd?'<p class="warn">'+(a.src==='aug'?'This is an augment, and this character is a Pure Human.':'This is a clan kit item; on an augmented character it takes an augment slot.')+'</p>':'')+'<div class="tx">'+(a.text||'')+'</div><div class="acts"><button type="button" class="danger" data-a="rmAug" data-i="'+i+'">Remove</button></div></div>';
  });

var undo = null;
function doRoll(){
  var c = C(), tr = document.getElementById('r-trait').value, mod = Number(document.getElementById('r-mod').value)||0;
  var adv = Number((document.querySelector('input[name="r-adv"]:checked')||{}).value||0), react = document.getElementById('r-react').checked;
  var exps = Array.prototype.map.call(document.querySelectorAll('.r-exp:checked'), function(x){ return c.experiences[Number(x.value)]; });
  undo = JSON.stringify({hope:c.hope, stressMarked:c.stressMarked});
  var notes = [];
  if(exps.length){ if(c.hope < exps.length){ document.getElementById('r-out').innerHTML = '<p class="warn">Not enough Hope for '+exps.length+' Experience'+(exps.length>1?'s':'')+'.</p>'; return; } c.hope -= exps.length; notes.push('Spent '+exps.length+' Hope on Experiences.'); }
  var hope = d(12), fear = d(12), ad = adv ? d(6) : 0;
  var tv = tr ? Number(c.traits[tr])||0 : 0, ev = exps.reduce(function(s,x){ return s + (Number(x.bonus)||0); }, 0);
  var total = hope + fear + tv + ev + mod + adv*ad;
  var out = hope === fear ? 'Critical success' : react ? 'Reaction roll' : hope > fear ? 'With Hope' : 'With Fear';
  if(!react){
    if(hope === fear){ c.hope = Math.min(hopeMax(), c.hope+1); c.stressMarked = Math.max(0, c.stressMarked-1); notes.push('Gained a Hope and cleared a Stress.'); }
    else if(hope > fear){ c.hope = Math.min(hopeMax(), c.hope+1); notes.push('Gained a Hope.'); }
    else notes.push('The GM gains a Fear.');

  save();
  var parts = [hope+' Hope', fear+' Fear'].concat(tr?[tr+' '+sgn(tv)]:[]).concat(ev?['Experiences '+sgn(ev)]:[]).concat(mod?['bonus '+sgn(mod)]:[]).concat(adv?[(adv>0?'advantage +':'disadvantage −')+ad]:[]);
  document.getElementById('r-out').innerHTML = '<div role="status"><div class="dice"><div class="die">Hope die<b>'+hope+'</b></div><div class="die">Fear die<b>'+fear+'</b></div>'+(adv?'<div class="die">'+(adv>0?'Advantage':'Disadvantage')+'<b>'+(adv>0?'+':'−')+ad+'</b></div>':'')+'</div>'+
    '<div class="result">'+total+'</div><div class="outcome">'+out+'</div><p class="small muted" style="text-align:center">'+e(parts.join(' · '))+'</p><p style="text-align:center">'+e(notes.join(' '))+'</p>'+

    [['wounds','Tend to all wounds: clear every Hit Point'],['stress','Clear all Stress'],['armor','Repair all Armor Slots'],['prepare','Prepare: gain 2 Hope']].forEach(function(m){ h += '<p><button type="button" data-a="restMove" data-m="l-'+m[0]+'" style="width:100%">'+e(m[1])+'</button></p>'; });
  }
  openDlg(kind === 'short' ? 'Short rest' : 'Long rest', h + '<div id="rest-out" role="status"></div>');
}
function restMove(m, btn){
  var c = C(), t = tier(), r = d(4) + t, msg;
  if(m === 's-wounds'){ var x = Math.min(r, c.hpMarked); c.hpMarked -= x; msg = 'Rolled '+r+': cleared '+x+' Hit Point'+(x===1?'':'s')+'.'; }
  else if(m === 's-stress'){ var y = Math.min(r, c.stressMarked); c.stressMarked -= y; msg = 'Rolled '+r+': cleared '+y+' Stress.'; }
  else if(m === 's-armor'){ var z = Math.min(r, c.armorMarked); c.armorMarked -= z; msg = 'Rolled '+r+': repaired '+z+' Armor Slot'+(z===1?'':'s')+'.'; }
  else if(m === 's-prepare'){ c.hope = Math.min(hopeMax(), c.hope+1); msg = 'Gained a Hope.'; }
  else if(m === 'l-wounds'){ c.hpMarked = 0; msg = 'All Hit Points cleared.'; }
  else if(m === 'l-stress'){ c.stressMarked = 0; msg = 'All Stress cleared.'; }
  else if(m === 'l-armor'){ c.armorMarked = 0; msg = 'All Armor Slots repaired.'; }
  else if(m === 'l-prepare'){ c.hope = Math.min(hopeMax(), c.hope+2); msg = 'Gained 2 Hope.'; }
  save();
  var out = document.getElementById('rest-out'); out.innerHTML += '<p class="good">'+e(msg)+'</p>';
}

/* ---------- backup ---------- */
function exportChar(){
  var c = C(), blob = new Blob([JSON.stringify({ chicago2089sheet:1, character:c }, null, 2)], { type:'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (c.name||'character').replace(/[^\w-]+/g,'_') + '-chicago2089.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importFile(f){
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var j = JSON.parse(rd.result), ch = j && j.character;
      if(!ch || !ch.traits) throw new Error('not a sheet');
      var base = blank(); Object.keys(ch).forEach(function(k){ base[k] = ch[k]; });
      if(!base.id || store.chars[base.id]) base.id = uid();
      store.chars[base.id] = base; store.current = base.id; save(); render(); alert('Loaded '+(base.name||'the character')+'.');
    }catch(x){ alert('That file isn\'t a Chicago 2089 character backup.'); }
  };
  rd.readAsText(f);
}

/* ---------- look ---------- */
function applyLook(){
  document.documentElement.style.fontSize = (store.font||20) + 'px';
  if(store.theme) document.documentElement.setAttribute('data-theme', store.theme === 'paper' ? 'paper' : store.theme); else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeBtn').textContent = 'Contrast: ' + ({'':'Auto', dark:'Dark', light:'Light', paper:'Paper'}[store.theme||'']);
}

if(!storageOK) document.getElementById('storageWarn').innerHTML = '<div class="banner">This browser won\'t let the sheet save (private browsing?). Use Save a backup file before you close it.</div>';
applyLook();
render();
})();
</script>
